name: release

# Push a tag like v0.2.0-alpha.1 to build everything and publish a pre-release.
# "Run workflow" from the Actions tab builds the same artifacts without publishing.
# Keep this file's name: the Android versionCode is its run number, which must keep rising.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-linux:
    runs-on: ubuntu-22.04   # older glibc => the binary runs on more distros
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build
        run: |
          pip install pyinstaller
          pyinstaller --onefile --name ytm-starcast \
            --add-data "starcast/static:starcast/static" --add-data "extension:starcast/extension" \
            --paths . --collect-submodules starcast packaging/entry.py
      - name: Smoke test
        run: |
          ./dist/ytm-starcast --version
          ./dist/ytm-starcast --port 8799 --dry-run --audio none --media none &
          sleep 3
          curl -sf http://127.0.0.1:8799/api/info
          curl -sf http://127.0.0.1:8799/ | grep -q "<title>YTM Starcast</title>"
          curl -sf http://127.0.0.1:8799/api/parts | grep -q '"discord"'
          curl -sf http://127.0.0.1:8799/api/beacon | grep -q '"headline"'
          kill %1
      - name: Package
        run: |
          mkdir ytm-starcast-linux-x86_64
          cp dist/ytm-starcast README.md LICENSE ytm-starcast-linux-x86_64/
          tar czf ytm-starcast-linux-x86_64.tar.gz ytm-starcast-linux-x86_64
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: ytm-starcast-linux-x86_64.tar.gz }

  server-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        shell: pwsh
        run: |
          pip install pyinstaller ".[windows]"
          # The lazily-imported Windows backends must at least import cleanly.
          python -c "import starcast.backends.windows.winaudio, starcast.backends.windows.gsmtc; print('windows backends import ok')"
      - name: Build
        shell: pwsh
        run: |
          pyinstaller --onefile --name ytm-starcast `
            --add-data "starcast/static;starcast/static" --add-data "extension;starcast/extension" `
            --paths . --collect-submodules starcast --collect-all winrt `
            packaging/entry.py
          # The desktop window (no console). tkinter ships with this Python.
          python -c "import tkinter; print('tkinter ok')"
          pyinstaller --onefile --windowed --name ytm-starcast-gui `
            --paths . --collect-submodules starcast.gui `
            packaging/gui_entry.py
      - name: Smoke test
        shell: pwsh
        run: |
          .\dist\ytm-starcast.exe --version
          $p = Start-Process .\dist\ytm-starcast.exe -PassThru `
            -ArgumentList "--port 8799 --dry-run --audio none --media none" `
            -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          $ok = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep 1
            try { (Invoke-WebRequest http://127.0.0.1:8799/api/info -UseBasicParsing).Content; $ok = $true; break } catch {}
          }
          if ($ok) {
            # Discord status (built in) must load in the packaged program too
            $b = (Invoke-WebRequest http://127.0.0.1:8799/api/beacon -UseBasicParsing).Content
            if ($b -notmatch '"headline"') { $ok = $false; Write-Host "no Discord status: $b" }
          }
          Get-Content out.txt, err.txt -ErrorAction SilentlyContinue
          Stop-Process $p -Force
          if (-not $ok) { throw "server did not start" }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory ytm-starcast-windows-x64 | Out-Null
          Copy-Item dist\ytm-starcast.exe, dist\ytm-starcast-gui.exe, packaging\install-exe.ps1, README.md, LICENSE ytm-starcast-windows-x64
          Compress-Archive ytm-starcast-windows-x64 ytm-starcast-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: ytm-starcast-windows-x64.zip }

  python-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install build
          python -m build
          # the web app and the Discord status engine must be inside the wheel
          python -m zipfile -l dist/*.whl | grep -q "starcast/static/index.html"
          python -m zipfile -l dist/*.whl | grep -q "starcast/discord/presence.py"
      - uses: actions/upload-artifact@v4
        with: { name: python, path: dist/* }

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check
        run: |
          python3 -m json.tool extension/manifest.json > /dev/null
          for f in extension/*.js; do node --check "$f"; done
      - name: Package
        # The files sit at the top of the zip: unzip it into a folder and "Load unpacked" that folder.
        run: |
          cd extension
          zip -r -X -q ../ytm-starcast-extension.zip .
          cd ..
          unzip -l ytm-starcast-extension.zip | grep -q " manifest.json$"
      - uses: actions/upload-artifact@v4
        with: { name: extension, path: ytm-starcast-extension.zip }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Signing key (when the repository has one)
        env:
          PF_KEYSTORE_B64: ${{ secrets.PF_KEYSTORE_B64 }}
        run: |
          if [ -n "$PF_KEYSTORE_B64" ]; then
            echo "$PF_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "PF_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the persistent release key."
          else
            echo "::warning::No PF_KEYSTORE_B64 secret: the APKs are signed with a throwaway key, so they cannot update an installed copy."
          fi
      - name: Build APK
        working-directory: android
        env:
          PF_KEYSTORE_PASSWORD: ${{ secrets.PF_KEYSTORE_PASSWORD }}
          PF_KEY_ALIAS: ${{ secrets.PF_KEY_ALIAS }}
        run: gradle --no-daemon :app:assembleRelease :app:assembleUnshrunk -PpfVersionName="${GITHUB_REF_NAME#v}" -PpfVersionCode="${GITHUB_RUN_NUMBER}"
      - name: Collect
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ytm-starcast-android.apk
          # An unshrunk build, in case the shrunk one misbehaves on some device.
          cp android/app/build/outputs/apk/unshrunk/app-unshrunk.apk ytm-starcast-android-unshrunk.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: "ytm-starcast-android*.apk" }

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server-linux, server-windows, python-package, extension, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - name: Name assets and checksum
        # The programs carry the tag in their names; the APKs and the extension keep plain names, so links to the
        # newest release always work.
        run: |
          cd artifacts
          mv ytm-starcast-linux-x86_64.tar.gz "ytm-starcast-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"
          mv ytm-starcast-windows-x64.zip "ytm-starcast-${GITHUB_REF_NAME}-windows-x64.zip"
          sha256sum * > SHA256SUMS.txt
          ls -la
          cat SHA256SUMS.txt
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --prerelease --title "YTM Starcast $GITHUB_REF_NAME" \
            --notes-file packaging/release-notes.md
