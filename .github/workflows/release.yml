name: release

# Push a tag like v0.1.0-alpha.1 to build everything and publish a pre-release.
# "Run workflow" from the Actions tab builds the same artifacts without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-linux:
    runs-on: ubuntu-22.04   # older glibc => the binary runs on more distros
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build
        run: |
          pip install pyinstaller
          pyinstaller --onefile --name pocketfader \
            --add-data "pocketfader/static:pocketfader/static" \
            --paths . --collect-submodules pocketfader packaging/entry.py
      - name: Smoke test
        run: |
          ./dist/pocketfader --version
          ./dist/pocketfader --port 8799 --dry-run --audio none --media none &
          sleep 3
          curl -sf http://127.0.0.1:8799/api/info
          curl -sf http://127.0.0.1:8799/ | grep -q Pocketfader
          kill %1
      - name: Package
        run: |
          mkdir pocketfader-linux-x86_64
          cp dist/pocketfader README.md LICENSE pocketfader-linux-x86_64/
          tar czf pocketfader-linux-x86_64.tar.gz pocketfader-linux-x86_64
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: pocketfader-linux-x86_64.tar.gz }

  server-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        shell: pwsh
        run: |
          pip install pyinstaller ".[windows]"
          # The lazily-imported Windows backends must at least import cleanly.
          python -c "import pocketfader.backends.windows.winaudio, pocketfader.backends.windows.gsmtc; print('windows backends import ok')"
      - name: Build
        shell: pwsh
        run: |
          pyinstaller --onefile --name pocketfader `
            --add-data "pocketfader/static;pocketfader/static" `
            --paths . --collect-submodules pocketfader --collect-all winrt `
            packaging/entry.py
          # The desktop window (no console). tkinter ships with this Python.
          python -c "import tkinter; print('tkinter ok')"
          pyinstaller --onefile --windowed --name pocketfader-gui `
            --paths . --collect-submodules pocketfader.gui `
            packaging/gui_entry.py
      - name: Smoke test
        shell: pwsh
        run: |
          .\dist\pocketfader.exe --version
          $p = Start-Process .\dist\pocketfader.exe -PassThru `
            -ArgumentList "--port 8799 --dry-run --audio none --media none" `
            -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          $ok = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep 1
            try { (Invoke-WebRequest http://127.0.0.1:8799/api/info -UseBasicParsing).Content; $ok = $true; break } catch {}
          }
          Get-Content out.txt, err.txt -ErrorAction SilentlyContinue
          Stop-Process $p -Force
          if (-not $ok) { throw "server did not start" }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory pocketfader-windows-x64 | Out-Null
          Copy-Item dist\pocketfader.exe, dist\pocketfader-gui.exe, packaging\install-exe.ps1, README.md, LICENSE pocketfader-windows-x64
          Compress-Archive pocketfader-windows-x64 pocketfader-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: pocketfader-windows-x64.zip }

  python-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with: { name: python, path: dist/* }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Signing key (when the repository has one)
        env:
          PF_KEYSTORE_B64: ${{ secrets.PF_KEYSTORE_B64 }}
        run: |
          if [ -n "$PF_KEYSTORE_B64" ]; then
            echo "$PF_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pf-release.jks"
            echo "PF_KEYSTORE=$RUNNER_TEMP/pf-release.jks" >> "$GITHUB_ENV"
            echo "Signing with the persistent release key."
          else
            echo "::warning::No PF_KEYSTORE_B64 secret: the APKs are signed with a throwaway key, so they cannot update an installed copy."
          fi
      - name: Build APK
        working-directory: android
        env:
          PF_KEYSTORE_PASSWORD: ${{ secrets.PF_KEYSTORE_PASSWORD }}
          PF_KEY_ALIAS: ${{ secrets.PF_KEY_ALIAS }}
        run: gradle --no-daemon :app:assembleRelease :app:assembleUnshrunk -PpfVersionName="${GITHUB_REF_NAME#v}" -PpfVersionCode="${GITHUB_RUN_NUMBER}"
      - name: Collect
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk pocketfader-android.apk
          # An unshrunk build, in case the shrunk one misbehaves on some device.
          cp android/app/build/outputs/apk/unshrunk/app-unshrunk.apk pocketfader-android-unshrunk.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: "pocketfader-android*.apk" }

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server-linux, server-windows, python-package, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - name: Name assets and checksum
        run: |
          cd artifacts
          mv pocketfader-android.apk "pocketfader-android-${GITHUB_REF_NAME}.apk"
          mv pocketfader-android-unshrunk.apk "pocketfader-android-unshrunk-${GITHUB_REF_NAME}.apk"
          mv pocketfader-linux-x86_64.tar.gz "pocketfader-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"
          mv pocketfader-windows-x64.zip "pocketfader-${GITHUB_REF_NAME}-windows-x64.zip"
          sha256sum * > SHA256SUMS.txt
          ls -la
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --prerelease --title "Pocketfader $GITHUB_REF_NAME" \
            --notes-file packaging/release-notes.md
