name: release

# Push a tag like v0.2.0-alpha.1 to build everything and publish a pre-release.
# "Run workflow" from the Actions tab builds the same artifacts without publishing.
# Keep this file's name: the Android versionCode is its run number, which must keep rising.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-linux:
    runs-on: ubuntu-22.04   # older glibc => the binary runs on more distros
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build
        run: |
          pip install pyinstaller
          pyinstaller --onefile --name ytm-starcast \
            --add-data "starcast/static:starcast/static" --add-data "extension:starcast/extension" \
            --paths . --collect-submodules starcast packaging/entry.py
      - name: Smoke test
        run: |
          ./dist/ytm-starcast --version
          ./dist/ytm-starcast --port 8799 --dry-run --audio none --media none &
          sleep 3
          curl -sf http://127.0.0.1:8799/api/info
          curl -sf http://127.0.0.1:8799/ | grep -q "<title>YTM Starcast</title>"
          curl -sf http://127.0.0.1:8799/api/parts | grep -q '"discord"'
          curl -sf http://127.0.0.1:8799/api/beacon | grep -q '"headline"'
          kill %1
      - name: Package
        run: |
          mkdir ytm-starcast-linux-x86_64
          cp dist/ytm-starcast README.md LICENSE ytm-starcast-linux-x86_64/
          tar czf ytm-starcast-linux-x86_64.tar.gz ytm-starcast-linux-x86_64
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: ytm-starcast-linux-x86_64.tar.gz }

  server-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        shell: pwsh
        run: |
          pip install pyinstaller pillow ".[windows]"      # Pillow: PyInstaller turns the PNG icon into the programs' .ico
          # The lazily-imported Windows backends must at least import cleanly.
          python -c "import starcast.backends.windows.winaudio, starcast.backends.windows.gsmtc; print('windows backends import ok')"
      - name: Build
        shell: pwsh
        run: |
          # No console window (it starts at logon): its messages go to server.log in its settings folder.
          pyinstaller --onefile --windowed --name ytm-starcast --icon starcast/static/icon-512.png `
            --add-data "starcast/static;starcast/static" --add-data "extension;starcast/extension" `
            --paths . --collect-submodules starcast --collect-all winrt `
            packaging/entry.py
          # The desktop window (no console). tkinter ships with this Python.
          python -c "import tkinter; print('tkinter ok')"
          pyinstaller --onefile --windowed --name ytm-starcast-gui --icon starcast/static/icon-512.png `
            --add-data "starcast/static/icon-192.png;starcast/static" `
            --paths . --collect-submodules starcast.gui `
            packaging/gui_entry.py
      - name: Installer scripts parse
        shell: powershell
        run: |
          foreach ($f in "packaging\install-exe.ps1", "packaging\install.ps1") {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs)
            if ($errs) { $errs | ForEach-Object { Write-Host "$f : $_" }; throw "$f doesn't parse" }
          }
      - name: Smoke test
        shell: pwsh
        run: |
          # both programs are windowed (no console window pops up)
          foreach ($f in "dist\ytm-starcast.exe", "dist\ytm-starcast-gui.exe") {
            $b = [IO.File]::ReadAllBytes($f); $pe = [BitConverter]::ToInt32($b, 0x3C)
            if ([BitConverter]::ToUInt16($b, $pe + 0x5C) -ne 2) { throw "$f opens a console window" }
          }
          $v = Start-Process .\dist\ytm-starcast.exe -ArgumentList "--version" -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput ver.txt
          $ver = (Get-Content ver.txt -Raw).Trim()
          Write-Host "version: $ver"
          if ($v.ExitCode -ne 0 -or -not $ver) { throw "--version didn't print the version" }
          $p = Start-Process .\dist\ytm-starcast.exe -PassThru `
            -ArgumentList "--port 8799 --dry-run --audio none --media none" `
            -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          $ok = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep 1
            try { (Invoke-WebRequest http://127.0.0.1:8799/api/info -UseBasicParsing).Content; $ok = $true; break } catch {}
          }
          if ($ok) {
            # Discord status (built in) must load in the packaged program too
            $b = (Invoke-WebRequest http://127.0.0.1:8799/api/beacon -UseBasicParsing).Content
            if ($b -notmatch '"headline"') { $ok = $false; Write-Host "no Discord status: $b" }
            $c = (Invoke-WebRequest http://127.0.0.1:8799/api/connect -UseBasicParsing).Content
            if ($c -notmatch '"addresses"') { $ok = $false; Write-Host "no addresses: $c" }
          }
          Get-Content out.txt, err.txt -ErrorAction SilentlyContinue
          Stop-Process $p -Force
          if (-not $ok) { throw "server did not start" }
          # started with nowhere to write (as at logon): its messages go to server.log in its settings folder
          $env:APPDATA = Join-Path $PWD "appdata"
          $p = Start-Process .\dist\ytm-starcast.exe -PassThru -ArgumentList "--port 8798 --dry-run --audio none --media none"
          $ok = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep 1
            try { [void](Invoke-WebRequest http://127.0.0.1:8798/api/info -UseBasicParsing); $ok = $true; break } catch {}
          }
          Start-Sleep 1
          Stop-Process $p -Force
          $log = Join-Path $env:APPDATA "ytm-starcast\server.log"
          Get-Content $log -ErrorAction SilentlyContinue
          if (-not $ok) { throw "the server didn't start without a console" }
          if (-not (Select-String -Path $log -Pattern "listening on" -Quiet)) { throw "nothing in server.log" }
      - name: Pictures of the desktop window
        # dark and light, at 100 % and 150 % display scaling, drawn with made-up answers (kept as an artifact)
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory gui-preview | Out-Null
          foreach ($m in "dark", "light") { foreach ($s in "1", "1.5") { python packaging/gui_preview.py $m $s "gui-preview/$m-$s.png" } }
          Get-ChildItem gui-preview
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with: { name: gui-preview, path: gui-preview }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory ytm-starcast-windows-x64 | Out-Null
          Copy-Item dist\ytm-starcast.exe, dist\ytm-starcast-gui.exe, packaging\install-exe.ps1, README.md, LICENSE ytm-starcast-windows-x64
          Compress-Archive ytm-starcast-windows-x64 ytm-starcast-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: ytm-starcast-windows-x64.zip }

  # install-exe.ps1 on a real Windows machine (Windows PowerShell 5.1, as people run it): options, updates, uninstall.
  install-windows:
    needs: server-windows
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: windows }
      - name: Install, update, uninstall
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Expand-Archive ytm-starcast-windows-x64.zip .
          $target = Join-Path $env:LOCALAPPDATA "Programs\YTM Starcast"
          $lnk = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\YTM Starcast.lnk"
          function Task-Args { [string](Get-ScheduledTask -TaskName "YTM Starcast").Actions[0].Arguments }
          function Check($ok, $what) { if (-not $ok) { throw "failed: $what" } else { Write-Host "ok: $what" } }
          # a stand-in for the old YTM Beacon app (any program that ends by itself), so its settings are taken over
          $beacon = Join-Path $env:LOCALAPPDATA "ytm-beacon"
          New-Item -ItemType Directory -Force $beacon | Out-Null
          Copy-Item "$env:WINDIR\System32\cmd.exe" (Join-Path $beacon "ytm-beacon.exe")

          $out = & .\ytm-starcast-windows-x64\install-exe.ps1 -NoDesktopApp -Port 8797 *>&1 | Out-String
          Write-Host $out
          Check ($out -match "Running YTM Beacon's own uninstaller") "the settings take-over was waited for and worked"
          Check ((Task-Args) -match "--port 8797") "the task has the port"
          Check (Test-Path (Join-Path $target "ytm-starcast.exe")) "the server is installed"
          Check (-not (Test-Path (Join-Path $target "ytm-starcast-gui.exe"))) "no desktop app"
          Check (-not (Test-Path $lnk)) "no Start menu entry"
          $up = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep 1
            try { [void](Invoke-WebRequest http://127.0.0.1:8797/api/info -UseBasicParsing); $up = $true; break } catch {}
          }
          if ($up) {
            $log = Join-Path $env:APPDATA "ytm-starcast\server.log"
            Get-Content $log
            Check (Select-String -Path $log -Pattern "listening on" -Quiet) "the server writes server.log"
            Check ((Invoke-WebRequest http://127.0.0.1:8797/api/connect -UseBasicParsing).Content -match '"addresses"') "/api/connect"
          } else {
            Write-Host "note: the scheduled task didn't start here: $((Get-ScheduledTaskInfo -TaskName 'YTM Starcast').LastTaskResult)"
          }

          $out = & .\ytm-starcast-windows-x64\install-exe.ps1 *>&1 | Out-String
          Write-Host $out
          Check ((Task-Args) -match "--port 8797") "an update keeps the port"
          Check (-not (Test-Path (Join-Path $target "ytm-starcast-gui.exe"))) "an update keeps the desktop app out"

          $out = & .\ytm-starcast-windows-x64\install-exe.ps1 -NoDesktopApp:$false -Port 8777 *>&1 | Out-String
          Write-Host $out
          Check (Test-Path (Join-Path $target "ytm-starcast-gui.exe")) "-NoDesktopApp:`$false brings the desktop app back"
          Check (Test-Path $lnk) "with its Start menu entry"
          Check (-not ((Task-Args) -match "--port")) "the default port needs no option"

          $out = & .\ytm-starcast-windows-x64\install-exe.ps1 -Uninstall *>&1 | Out-String
          Write-Host $out
          Check (-not (Get-ScheduledTask -TaskName "YTM Starcast" -ErrorAction SilentlyContinue)) "uninstall removes the task"
          Check (-not (Test-Path $target)) "and the program"

  python-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install build
          python -m build
          # the web app and the Discord status engine must be inside the wheel
          python -m zipfile -l dist/*.whl | grep -q "starcast/static/index.html"
          python -m zipfile -l dist/*.whl | grep -q "starcast/discord/presence.py"
      - uses: actions/upload-artifact@v4
        with: { name: python, path: dist/* }

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check
        run: |
          python3 -m json.tool extension/manifest.json > /dev/null
          for f in extension/*.js; do node --check "$f"; done
      - name: Package
        # The files sit at the top of the zip: unzip it into a folder and "Load unpacked" that folder.
        run: |
          cd extension
          zip -r -X -q ../ytm-starcast-extension.zip .
          cd ..
          unzip -l ytm-starcast-extension.zip | grep -q " manifest.json$"
      - uses: actions/upload-artifact@v4
        with: { name: extension, path: ytm-starcast-extension.zip }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Signing key (when the repository has one)
        env:
          PF_KEYSTORE_B64: ${{ secrets.PF_KEYSTORE_B64 }}
        run: |
          if [ -n "$PF_KEYSTORE_B64" ]; then
            echo "$PF_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "PF_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the persistent release key."
          else
            echo "::warning::No PF_KEYSTORE_B64 secret: the APKs are signed with a throwaway key, so they cannot update an installed copy."
          fi
      - name: Build APK
        working-directory: android
        env:
          PF_KEYSTORE_PASSWORD: ${{ secrets.PF_KEYSTORE_PASSWORD }}
          PF_KEY_ALIAS: ${{ secrets.PF_KEY_ALIAS }}
        run: gradle --no-daemon :app:assembleRelease :app:assembleUnshrunk -PpfVersionName="${GITHUB_REF_NAME#v}" -PpfVersionCode="${GITHUB_RUN_NUMBER}"
      - name: Collect
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ytm-starcast-android.apk
          # An unshrunk build, in case the shrunk one misbehaves on some device.
          cp android/app/build/outputs/apk/unshrunk/app-unshrunk.apk ytm-starcast-android-unshrunk.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: "ytm-starcast-android*.apk" }

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server-linux, server-windows, python-package, extension, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - name: Name assets and checksum
        # The programs carry the tag in their names; the APKs and the extension keep plain names, so links to the
        # newest release always work.
        run: |
          cd artifacts
          mv ytm-starcast-linux-x86_64.tar.gz "ytm-starcast-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"
          mv ytm-starcast-windows-x64.zip "ytm-starcast-${GITHUB_REF_NAME}-windows-x64.zip"
          sha256sum * > SHA256SUMS.txt
          ls -la
          cat SHA256SUMS.txt
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --prerelease --title "YTM Starcast $GITHUB_REF_NAME" \
            --notes-file packaging/release-notes.md
