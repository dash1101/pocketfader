name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (fake backends only; never touches audio)
        run: python -m unittest discover -s tests -t .
      - name: Package builds and ships the web app
        run: |
          pip install build
          python -m build --wheel
          python -m zipfile -l dist/*.whl | grep -q static/index.html

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Compile the Android app (debug and release)
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease
      - name: Show the APK's minimum Android version
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          "$AAPT" dump badging android/app/build/outputs/apk/release/app-release.apk | grep -E "^package|sdkVersion|targetSdkVersion|application-label:"
          ls -la android/app/build/outputs/apk/release/app-release.apk
