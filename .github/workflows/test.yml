name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (fake backends only; never touches audio)
        run: python -m unittest discover -s tests -t .
      - name: Package builds and ships the web app
        run: |
          pip install build
          python -m build --wheel
          python -m zipfile -l dist/*.whl | grep -q static/index.html
