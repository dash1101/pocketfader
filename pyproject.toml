[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ytm-starcast"
version = "0.2.1-alpha"
description = "YouTube Music companion: a remote for your phone, your music as your Discord status, and a better YouTube Music."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = []   # the Linux build is standard-library only

[project.optional-dependencies]
# Windows hosts only (volume + media session + optional Voicemeeter extras).
windows = [
  "pycaw; sys_platform == 'win32'",
  "winrt-runtime; sys_platform == 'win32'",
  "winrt-Windows.Media.Control; sys_platform == 'win32'",
  "winrt-Windows.Foundation; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections; sys_platform == 'win32'",
  "winrt-Windows.Storage.Streams; sys_platform == 'win32'",
]

[project.scripts]
ytm-starcast = "starcast.cli:main"

[project.gui-scripts]
ytm-starcast-gui = "starcast.gui:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["starcast*"]

[tool.setuptools.package-data]
starcast = ["static/*"]
