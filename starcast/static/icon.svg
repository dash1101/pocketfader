<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9F5EC"/><stop offset=".5" stop-color="#E3D6FF"/><stop offset="1" stop-color="#FFB9AA"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/><stop offset=".45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C323B"/><stop offset="1" stop-color="#15191F"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E4ECF2"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/><feOffset dy="12" result="b"/>
      <feFlood flood-color="#3A2A40" flood-opacity=".30"/><feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bg)"/><rect x="24" y="24" width="464" height="464" rx="120" fill="url(#gloss)"/>
  <!-- a record (YouTube Music) whose ring is three faders' colours (the remote), and a star sending out light (Discord status) -->
  <g filter="url(#sh)">
    <circle cx="246" cy="280" r="150" fill="url(#card)"/>
  </g>
