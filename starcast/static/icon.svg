    <path d="M320.4,334.1 A92,92 0 0 1 171.6,334.1" stroke="#FFC94D" stroke-width="16"/>
    <path d="M162.0,317.4 A92,92 0 0 1 236.4,188.5" stroke="#38D9C4" stroke-width="16"/>
