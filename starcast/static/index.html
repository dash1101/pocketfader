// The last searches, kept on this device (newest first).
function recentSearches() { const v = lsGet('vmr-recent', []); return Array.isArray(v) ? v.filter(x => typeof x === 'string') : []; }

// What a search looks for: everything, or one kind. The choice stays while you search for other things.
const SEARCH_FILTERS = [['', 'All', 'results'], ['songs', 'Songs', 'songs'], ['artists', 'Artists', 'artists'],
                        ['albums', 'Albums', 'albums'], ['playlists', 'Playlists', 'playlists']];
const FILTER_KIND = { songs:'song', artists:'artist', albums:'album', playlists:'playlist' };
let searchFilter = '', searchSeq = 0;
function filterBar(q) {
  const bar = el('div', 'searchfilters'); bar.setAttribute('role', 'group'); bar.setAttribute('aria-label', 'Show');
  for (const [id, label] of SEARCH_FILTERS) {
    const c = el('button', 'recentchip'); c.type = 'button'; c.textContent = label;
    c.setAttribute('aria-pressed', String(searchFilter === id));

async function doSearch(q) {
  if (!q) return;
  if (view !== 'search') setView('search');     // typed on another of Search's tabs
  const res = $('#searchres'); if (!res) return;
  const box = $('#searchbox'); if (box && box.value.trim() !== q) box.value = q;
  const seq = ++searchSeq, filter = searchFilter;
  res.innerHTML = ''; res.appendChild(filterBar(q));
  const spin = el('div', 'spinner'); res.appendChild(spin);
  const body = { type:'search', query:q }; if (filter) body.filter = filter;
  const r = await ytm(body, true);
  // a newer search (or another filter) was asked for meanwhile: this answer is out of date
  if (view !== 'search' || seq !== searchSeq) return;
  spin.remove();
  let items = (r && r.items) || [];
  // an older extension ignores the filter and answers with everything: keep the kind that was asked for
  if (filter) items = items.filter(it => it.kind === FILTER_KIND[filter]);
  if (r && r.error) { res.appendChild(emptyMsg(ytmError(r.error) + '.')); return; }
  if (!items.length) {
    const what = (SEARCH_FILTERS.find(f => f[0] === filter) || SEARCH_FILTERS[0])[2];
    res.appendChild(emptyMsg('No ' + what + ' for \u201c' + q + '\u201d.')); return;
  }
  rememberSearch(q);   // only searches that found something

  const setPinLabel = () => pinBtn.innerHTML = (isPinned(d) ? STAR_ON + 'Pinned' : STAR_OFF + 'Favorite');
  setPinLabel();
  pinBtn.addEventListener('click', () => { const on = togglePin(d); setPinLabel(); refreshFavoriteWidgets(); toast(on ? 'Pinned to favorites' : 'Unpinned'); });

  moreBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 8a2 2 0 100-4 2 2 0 000 4zm0 6a2 2 0 100-4 2 2 0 000 4zm0 6a2 2 0 100-4 2 2 0 000 4z"/></svg>';
  moreBtn.addEventListener('click', () => openCollectionSheet(d, pid));
  // Editing is offered only for playlists the account owns (their tracks carry a setVideoId).
  const editBtn = el('button', 'pill ghost'); editBtn.style.display = 'none';
  const PEN = '<svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75L3 17.25zM20.7 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>';
  const TICK = '<svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>';
  acts.append(playBtn, shufBtn, editBtn, pinBtn, moreBtn);
  info.appendChild(acts); head.append(img, info); m.appendChild(head);
  onDetailRenamed = name => { d.title = name; const t = info.querySelector('.t'); if (t && t.isConnected) t.textContent = name; };

  const list = el('div', 'list'); list.appendChild(el('div', 'spinner')); m.appendChild(list);
  const r = await ytm({ type:'playlistItems', playlistId: pid, browseId: d.browseId });
  list.innerHTML = '';
  let items = (r && r.items) || [];
  if (!items.length) {
    list.appendChild(emptyMsg(r && !r.error ? 'This playlist is empty.' : 'Couldn\'t load the songs' + (r && r.error === 'timeout' ? ' in time. Try again.' : '. Is YouTube Music open on the computer?')));
    return;
  }
  const editable = !!pid && items.some(i => i.setVideoId);
  d.editable = editable;
  let editing = false;

  const I = { up:'<svg viewBox="0 0 24 24"><path d="M7.4 14.6L12 10l4.6 4.6L18 13.2l-6-6-6 6z"/></svg>',
    down:'<svg viewBox="0 0 24 24"><path d="M7.4 9.4L12 14l4.6-4.6L18 10.8l-6 6-6-6z"/></svg>',
    del:'<svg viewBox="0 0 24 24"><path d="M6 7h12v13a2 2 0 01-2 2H8a2 2 0 01-2-2zm3-4h6l1 2h4v2H4V5h4z"/></svg>' };
  const mkBtn = (cls, icon, label, fn, off) => { const b = el('button', 'ebtn ' + cls); b.innerHTML = icon; b.title = label;
    b.setAttribute('aria-label', label); b.disabled = !!off; b.addEventListener('click', e => { e.stopPropagation(); fn(); }); return b; };

  const paint = () => {
    list.innerHTML = '';
    items.forEach((it, i) => {
      if (!editing) { list.appendChild(listItem(it)); return; }
      const li = el('div', 'li editing');
      const meta = el('div', 'meta');
      const tt = el('div', 't'); tt.textContent = it.title;
      const ss = el('div', 's'); ss.textContent = it.subtitle || '';
      meta.append(tt, ss);
      li.append(thumbBox(it.thumb), meta,
        mkBtn('up', I.up, 'Move up', () => movePl(i, -1), i === 0),
        mkBtn('down', I.down, 'Move down', () => movePl(i, 1), i === items.length - 1),
        mkBtn('del', I.del, 'Remove from playlist', () => removePl(i)));
      list.appendChild(li);
    });
  };
  // A move sends "put this track before X" where X is the track that should end up right after it.
  async function movePl(i, dir) {
    const j = i + dir; if (j < 0 || j >= items.length) return;
    const it = items[i], succ = dir < 0 ? items[j] : items[j + 1];
    const prev = items.slice();
    items.splice(i, 1); items.splice(j, 0, it); paint();
    const ok = await plOp({ type:'playlistMove', playlistId:pid, setVideoId:it.setVideoId, before: succ ? succ.setVideoId : undefined });
    if (!ok) { items = prev; paint(); } else cache.playlists = null;
  }
  async function removePl(i) {
    const it = items[i], prev = items.slice();
    items.splice(i, 1); paint();
    const ok = await plOp({ type:'playlistRemove', playlistId:pid, setVideoId:it.setVideoId, videoId:it.videoId }, 'Removed from playlist');
    if (!ok) { items = prev; paint(); } else cache.playlists = null;
  }
  if (editable) {
    const setLabel = () => { editBtn.innerHTML = editing ? TICK + 'Done' : PEN + 'Edit'; editBtn.classList.toggle('primary', editing); editBtn.classList.toggle('ghost', !editing); };
    setLabel(); editBtn.style.display = '';
    editBtn.addEventListener('click', () => { editing = !editing; setLabel(); paint(); });
  }
  paint();
}

      const wanted = inp.value.trim();

        // the bridge verifies it's reachable first, so a typo can't strand you

    rs.appendChild(rb); cs.appendChild(rs);
    m.appendChild(cs);
  }
}

function openThemeEditor(m, existing) {
  const cs = getComputedStyle(document.documentElement);
  const start = {};
  for (const k of THEME_VARS) {
    if (existing) { start[k] = existing.vars[k]; continue; }
    const raw = cs.getPropertyValue('--' + k).trim();
    start[k] = raw.startsWith('#') ? raw : rgb2hex(raw);
  }
  m.innerHTML = ''; m.appendChild(topbar('Theme editor'));
  const wrap = el('div', 'setsec');
  const LABELS = { bg:'Background', panel:'Panel / sidebar', card:'Card', card2:'Card (raised)', line:'Borders',

/* ==================== custom color picker (HEX / RGB / HSL) ==================== */
function hex2rgb(h) { h = (h || '').replace('#', '').trim(); if (h.length === 3) h = h.split('').map(c => c + c).join('');
  if (h.length !== 6) return null; const n = parseInt(h, 16); if (isNaN(n)) return null; return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgbHex(r, g, b) { return '#' + [r, g, b].map(x => Math.max(0, Math.min(255, Math.round(x))).toString(16).padStart(2, '0')).join(''); }
function rgb2hsv(r, g, b) { r /= 255; g /= 255; b /= 255; const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn; let h = 0;
  if (d) { if (mx === r) h = ((g - b) / d) % 6; else if (mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4; h *= 60; if (h < 0) h += 360; } return [h, mx ? d / mx : 0, mx]; }
function hsv2rgb(h, s, v) { const c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c; let a;
  if (h < 60) a = [c, x, 0]; else if (h < 120) a = [x, c, 0]; else if (h < 180) a = [0, c, x]; else if (h < 240) a = [0, x, c]; else if (h < 300) a = [x, 0, c]; else a = [c, 0, x];
  return a.map(z => (z + m) * 255); }
function rgb2hsl(r, g, b) { r /= 255; g /= 255; b /= 255; const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn; let h = 0, s = 0;
  if (d) { s = d / (1 - Math.abs(2 * l - 1)); if (mx === r) h = ((g - b) / d) % 6; else if (mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4; h *= 60; if (h < 0) h += 360; } return [h, s, l]; }
function hsl2rgb(h, s, l) { const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2; let a;
  if (h < 60) a = [c, x, 0]; else if (h < 120) a = [x, c, 0]; else if (h < 180) a = [0, c, x]; else if (h < 240) a = [0, x, c]; else if (h < 300) a = [x, 0, c]; else a = [c, 0, x];
  return a.map(z => (z + m) * 255); }

const CP = { h:0, s:0, v:0, mode:'hex', onLive:null, onDone:null, onCancel:null };
const cpHex = () => rgbHex(...hsv2rgb(CP.h, CP.s, CP.v));
function cpRender() {
  const [r, g, b] = hsv2rgb(CP.h, CP.s, CP.v).map(Math.round);
  $('#cp-sv').style.background = rgbHex(...hsv2rgb(CP.h, 1, 1));
  $('#cp-svknob').style.left = (CP.s * 100) + '%'; $('#cp-svknob').style.top = ((1 - CP.v) * 100) + '%';
  $('#cp-hueknob').style.left = (CP.h / 360 * 100) + '%';
  const wrap = $('#cp-inputs'); wrap.innerHTML = '';
  const mk = (val, on) => { const i = el('input'); i.value = val; i.addEventListener('change', () => on(i.value)); wrap.appendChild(i); };
  if (CP.mode === 'hex') mk(cpHex(), v => { const rgb = hex2rgb(v); if (rgb) { [CP.h, CP.s, CP.v] = rgb2hsv(...rgb); cpRender(); } });
  else if (CP.mode === 'rgb') ['R','G','B'].forEach((_, i) => mk([r,g,b][i], v => { const a = [r,g,b]; a[i] = parseInt(v) || 0; [CP.h,CP.s,CP.v] = rgb2hsv(...a); cpRender(); }));
  else { const hsl = rgb2hsl(r,g,b), disp = [Math.round(hsl[0]), Math.round(hsl[1]*100), Math.round(hsl[2]*100)];
    ['H','S','L'].forEach((_, i) => mk(disp[i], v => { const a = disp.slice(); a[i] = parseInt(v) || 0; [CP.h,CP.s,CP.v] = rgb2hsv(...hsl2rgb(a[0], a[1]/100, a[2]/100)); cpRender(); })); }
  if (CP.onLive) CP.onLive(cpHex());
}
function cpDrag(elm, handler) {
  const move = e => { const rc = elm.getBoundingClientRect();
    handler(Math.max(0, Math.min(1, (e.clientX - rc.left) / rc.width)), Math.max(0, Math.min(1, (e.clientY - rc.top) / rc.height))); };
  elm.addEventListener('pointerdown', e => { e.preventDefault(); elm.setPointerCapture?.(e.pointerId); move(e);
    const mv = ev => move(ev); const up = () => { elm.removeEventListener('pointermove', mv); elm.removeEventListener('pointerup', up); };
    elm.addEventListener('pointermove', mv); elm.addEventListener('pointerup', up); });
}
function openColorPicker(hex, title, onLive, onDone) {
  const rgb = hex2rgb(hex) || [128, 128, 128]; [CP.h, CP.s, CP.v] = rgb2hsv(...rgb);
  CP.onLive = onLive; CP.onDone = onDone; CP.onCancel = null;
  $('#cp-title').textContent = title || 'Color'; cpRender(); $('#cpwrap').classList.add('show');
}
cpDrag($('#cp-sv'), (x, y) => { CP.s = x; CP.v = 1 - y; cpRender(); });
cpDrag($('#cp-hue'), x => { CP.h = x * 360; cpRender(); });
document.querySelectorAll('.cptab').forEach(t => t.addEventListener('click', () => {
  CP.mode = t.dataset.m; document.querySelectorAll('.cptab').forEach(x => x.classList.toggle('sel', x === t)); cpRender(); }));
const cpClose = (cancel) => { if (cancel && CP.onCancel) CP.onCancel(); $('#cpwrap').classList.remove('show'); };
$('#cp-cancel').addEventListener('click', () => cpClose(true));
$('#cp-ok').addEventListener('click', () => { if (CP.onDone) CP.onDone(cpHex()); cpClose(false); });
$('#cpwrap').addEventListener('click', e => { if (e.target.id === 'cpwrap') cpClose(true); });

  if (item.kind === 'favorites') { setView('favorites'); return; }
  if (item.kind === 'song' && item.videoId) {
    optimisticNow(item);   // paint what we already know instantly
    ytm({ type:'play', videoId:item.videoId, playlistId:item.playlistId }); toast('Playing'); setRailTab('queue');

    detailStack = item; setView('detail');
  } else if (item.kind === 'song') {
    ytm({ type:'play', videoId:item.videoId }); toast('Playing');

}

function shareItem(item) {
  const url = item.videoId ? 'https://music.youtube.com/watch?v=' + item.videoId
    : item.playlistId ? 'https://music.youtube.com/playlist?list=' + item.playlistId : 'https://music.youtube.com/';
  const title = (item.title || 'YouTube Music') + (item.subtitle ? ' — ' + item.subtitle : '');
  if (navigator.share) { navigator.share({ title, url }).catch(() => {}); return; }
  // Web Share needs a secure context (this app is plain HTTP over Tailscale), so fall
  // back to copying the link — execCommand still works in non-secure contexts.
  const ta = document.createElement('textarea'); ta.value = url; ta.style.cssText = 'position:fixed;opacity:0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('Link copied'); } catch (e) { toast(url); }
  document.body.removeChild(ta);
}

        if (!opts.some(o => o[0] === cur)) { opts.push([cur, cur >= 60 && cur % 60 === 0 ? (cur / 60) + ' hours' : cur + ' min']); opts.sort((a, b) => a[0] - b[0]); }

      }
    });
    box.appendChild(row('Name next to your username', 'What the member list shows next to your name.',
      choice(STATUS_NAME, S.statusDisplay || 'name', val => setting('statusDisplay', val)), 'stack'));
    if (Array.isArray(S.hideMatching)) box.appendChild(wordsRow(S.hideMatching.filter(w => typeof w === 'string')));
    // as YTM Beacon's dashboard had: a test song on Discord for 30 seconds, to see the card for real
    if ('preview' in st) {
      const tb = el('button', 'pill ghost'); tb.textContent = 'Show a test song'; tb.style.height = '38px';
      tb.addEventListener('click', async () => {

        toast(r && r.ok ? (r.dryRun ? 'Trial run: nothing was sent to Discord' : 'A test song shows on Discord for 30 seconds')
          : ((r && (r.message || r.error)) || "Couldn't reach the computer"));

  }
  // "Never show songs matching": a list of words; a song whose title, artist or album contains one stays off Discord.
  function wordsRow(words) {
    const r = row('Never show songs matching', 'A song whose title, artist or album contains one of these words stays off Discord.', null, 'stack');
    if (words.length) {

        t.textContent = w; x.innerHTML = X_ICON; x.title = 'Remove'; x.setAttribute('aria-label', 'Remove ' + w);
        x.addEventListener('click', () => setting('hideMatching', words.filter(z => z !== w), false));

    }
    const f = el('form', 'wordadd'), inp = el('input'), add = el('button', 'pill ghost');
    inp.placeholder = words.length ? 'Another word or name' : 'A word or a name'; inp.maxLength = HIDE_WORD_LEN; inp.autocomplete = 'off';
    inp.value = draft; inp.setAttribute('aria-label', 'A word to never show'); inp.setAttribute('enterkeyhint', 'done');

      if (words.length >= HIDE_WORDS_MAX) { toast('The list is full (' + HIDE_WORDS_MAX + ' words)'); return; }

  }
  // Moves over from the separate YTM Beacon app: the computer brings its settings along and removes it.
  async function migrate() {
    if (moving) return;

    const r = await post('/api/beacon/migrate', {});
    moving = false;

  // What you tap shows at once and is kept for a few seconds, so a poll that lands first can't flip it back.
  // soft: the control already shows the change itself; redraw once it has had time to move.
  async function act(path, body, visPatch, key, val, soft) {
    const prev = st; heldUntil = Date.now() + 4000;

      if (j.headline === 'unreachable') misses++; else misses = 0;

  setTimeout(() => refresh(true), 60);   // after the settings sheet has attached this section
  const tick = () => { if (!sec.isConnected) return; if (!document.hidden) refresh(); setTimeout(tick, 5000); };
  setTimeout(tick, 5000);

}

/* ==================== mixer (volume + optional EQ/meter, depending on the backend's capabilities) ==================== */
let holdVol = false; const holdEq = {}; let volPending = null, volTimer = null;
const eqPending = {}, eqTimer = {}; let mixerState = null;
// After a user change, ignore polled values for a beat so the slider doesn't snap back
// to the pre-change value before the server round-trip lands (the "rubber banding").
let volSettleUntil = 0, seekSettleUntil = 0, likeSettleUntil = 0, likeSettleVid = null;

function sendVol(v) { volPending = v; volSettleUntil = Date.now() + 650; if (volTimer) return;
  volTimer = setTimeout(() => { volTimer = null; if (volPending !== null) { post('/api/volume', {percent:volPending}); volPending = null; } }, 60); }
function sendEq(band, db) { eqPending[band] = db; if (eqTimer[band]) return;
  eqTimer[band] = setTimeout(() => { eqTimer[band] = null; if (eqPending[band] !== undefined) { post('/api/eq', {band, db:eqPending[band]}); delete eqPending[band]; } }, 60); }
const fmtEq = v => (v > 0 ? '+' : '') + Number(v).toFixed(1) + ' dB';

// Mixer can appear in two places at once (main view + rail tab), so we mount an
// independent node per container and keep them all in sync from one state.
let mixerNodes = [];
function buildMixer() {
  const c = el('div', 'mx');
  c.innerHTML = `
    <div class="mxrow"><span class="l">Volume</span><span class="v" id="vpct">—</span></div>
    <div class="meter"><i id="meter"></i></div>
    <input type="range" id="vol" class="big" min="0" max="100" step="1" value="0">
    <button id="mute">Mute</button>
    <div class="outrow" id="outrow" style="display:none"><span class="l">Output</span>
      <button class="outbtn" id="outbtn"><span id="outname">—</span><svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg></button></div>
    <div class="eqtoggle" id="eqtoggle" style="display:none"><span class="l">Equalizer</span><button class="toggle" id="eqsw" aria-label="Equalizer on/off"></button></div>
    <div class="eqpresets" id="eqpresets" style="display:none"></div>
    <div class="eqstatus" id="eqstatus"></div>
    <div class="eqhead"><span class="l">EQ</span><button id="eqreset">Reset</button></div>
    <div class="band"><label>Bass</label><input type="range" data-band="bass" min="-12" max="12" step="0.5" value="0"><span class="bd" id="bd-bass">0.0 dB</span></div>
    <div class="band"><label>Med</label><input type="range" data-band="mid" min="-12" max="12" step="0.5" value="0"><span class="bd" id="bd-mid">0.0 dB</span></div>
    <div class="band"><label>High</label><input type="range" data-band="high" min="-12" max="12" step="0.5" value="0"><span class="bd" id="bd-high">0.0 dB</span></div>
    <div class="viz mixviz"></div>
    <div class="mixnote" id="mixnote"></div>`;
  const vz = c.querySelector('.mixviz');
  if (vz) { for (let i = 0; i < 24; i++) vz.appendChild(el('div', 'vbar'));
    vz._bars = [...vz.children]; vz._vals = new Array(24).fill(0); }
  const vol = c.querySelector('#vol');
  vol.addEventListener('pointerdown', () => holdVol = true);
  const relV = () => { holdVol = false; if (volPending !== null) { post('/api/volume', {percent:volPending}); volPending = null; } };
  vol.addEventListener('pointerup', relV); vol.addEventListener('pointercancel', relV);
  vol.addEventListener('input', () => { c.querySelector('#vpct').textContent = vol.value + '%'; sendVol(parseInt(vol.value,10)); });
  c.querySelector('#mute').addEventListener('click', () => post('/api/volume', {muted: !c.querySelector('#mute').classList.contains('on')}));
  c.querySelectorAll('[data-band]').forEach(inp => { const band = inp.dataset.band;
    inp.addEventListener('pointerdown', () => holdEq[band] = true);
    const rel = () => { holdEq[band] = false; if (eqPending[band] !== undefined) { post('/api/eq', {band, db:eqPending[band]}); delete eqPending[band]; } };
    inp.addEventListener('pointerup', rel); inp.addEventListener('pointercancel', rel);
    inp.addEventListener('input', () => { const v = parseFloat(inp.value); c.querySelector('#bd-'+band).textContent = fmtEq(v); sendEq(band, v); }); });
  c.querySelector('#outbtn').addEventListener('click', openOutputs);
  c.querySelector('#eqsw').addEventListener('click', async () => {
    const on = !c.querySelector('#eqsw').classList.contains('on');
    c.querySelector('#eqsw').classList.toggle('on', on);
    const r = await post('/api/eq', { enabled:on });
    if (r && r.error) { toast(r.error); c.querySelector('#eqsw').classList.toggle('on', !on); }
    else toast(on ? 'Equalizer on' : 'Equalizer off');
  });
  c.querySelector('#eqreset').addEventListener('click', async () => { for (const b of ['bass','mid','high']) await post('/api/eq', {band:b, db:0}); });
  return c;
}
function paintMixer(container) {
  let node = container.querySelector('.mx');
  if (!node) { node = buildMixer(); container.appendChild(node); mixerNodes.push(node); }
  mixerNodes = mixerNodes.filter(n => n.isConnected);
  applyMixer();
}
function applyMixer() {
  if (!mixerState) return; const st = mixerState;
  const v = st.volume || {}, e = st.engine || {}, eq = e.eq || {};
  const volSettled = Date.now() > volSettleUntil;
  // rail master slider
  const mv = $('#mvol');
  if (mv) { if (!holdVol && volSettled && v.available) { mv.value = v.percent; $('#mvolpct').textContent = v.percent + '%'; } mv.disabled = !v.available; }
  const caps = st.capabilities || {};
  const notes = []; const r = e.routing || {};
  if (!v.available) notes.push('<b>No audio output found on the computer.</b>');
  if (caps.engine_label && e.connected && r.A1 === false && r.A2 === false) notes.push('<b>Not routed to any output.</b>');
  if (caps.engine_label && !e.connected) notes.push('<b>' + caps.engine_label + ' engine not reachable.</b>');
  if (v.muted) notes.push('<b>Muted.</b>');
  if (v.available) notes.push('Controls the computer\'s main volume' + (v.device ? ' (' + v.device + ')' : '') + ' and follows its volume keys.');
  document.querySelectorAll('.viz').forEach(z => { z.style.display = caps.meter ? '' : 'none'; });
  for (const node of mixerNodes) {
    if (!node.isConnected) continue;
    const vol = node.querySelector('#vol');
    if (!holdVol && volSettled && v.available) { vol.value = v.percent; node.querySelector('#vpct').textContent = v.percent + '%'; }
    vol.disabled = !v.available;
    const mute = node.querySelector('#mute'); mute.classList.toggle('on', !!v.muted); mute.textContent = v.muted ? 'Muted' : 'Mute';
    node.querySelector('#meter').style.width = Math.min(100, (e.level||0)*140) + '%';
    node.querySelector('.meter').style.display = caps.meter ? '' : 'none';
    // Output picker + EQ switch (shown only when the host supports them)
    node.querySelector('#outrow').style.display = caps.outputs ? '' : 'none';
    node.querySelector('#outname').textContent = v.device || 'Choose output';
    node.querySelector('#eqtoggle').style.display = caps.eq_toggle ? '' : 'none';
    node.querySelector('#eqsw').classList.toggle('on', !!e.enabled);
    const eqLive = caps.eq && (!caps.eq_toggle || e.enabled);       // sliders only matter while the EQ is active
    for (const q of node.querySelectorAll('.eqhead, .band')) q.style.display = eqLive ? '' : 'none';
    const pr = node.querySelector('#eqpresets');
    pr.style.display = caps.eq_toggle && e.enabled && (e.presets || []).length ? '' : 'none';
    if (pr.style.display === '' && pr.childElementCount !== e.presets.length) {
      pr.innerHTML = ''; for (const name of e.presets) { const b = el('button'); b.textContent = name.replace('-', ' '); b.addEventListener('click', () => post('/api/eq', { preset:name }).then(r => r && r.error && toast(r.error))); pr.appendChild(b); }
    }
    node.querySelector('#eqstatus').textContent = caps.eq_toggle ? (e.available === false ? e.reason : e.status || '') : '';
    const mn = node.querySelector('#mixnote');
    if (node.classList.contains('eqonly') && !caps.eq) { mn.style.display = 'block'; mn.innerHTML = 'EQ isn\'t available with this audio backend.'; continue; }
    for (const band of ['bass','mid','high']) { const val = eq[band]; if (val == null || holdEq[band]) continue;
      node.querySelector('[data-band="'+band+'"]').value = val; node.querySelector('#bd-'+band).textContent = fmtEq(val); }
    node.querySelector('#mixnote').innerHTML = notes.join(' ');
  }
}


/* ==================== output picker (switch device, set levels before switching) ==================== */
let outTimer = null, outHold = false, outSig = '';
const OUT_KIND = { bluetooth:'Bluetooth', usb:'USB', hdmi:'HDMI / display', analog:'Analog', virtual:'Virtual' };
function closeOutputs() { const b = $('#outsheet'); if (b) b.classList.remove('show'); clearTimeout(outTimer); outTimer = null; }
async function openOutputs() {
  let box = $('#outsheet');
  if (!box) {
    box = el('div'); box.id = 'outsheet';
    box.innerHTML = '<div class="osback"></div><div class="oscard"><div class="oshead"><span>Audio output</span><button class="osx" aria-label="Close">✕</button></div><div class="oslist"></div><div class="oshint">Set a device\'s level first, then tap Use to switch to it.</div></div>';
    document.body.appendChild(box);
    box.querySelector('.osback').addEventListener('click', closeOutputs); box.querySelector('.osx').addEventListener('click', closeOutputs);
  }
  outSig = ''; requestAnimationFrame(() => box.classList.add('show'));
  refreshOutputs(true);
}
async function refreshOutputs(first) {
  const box = $('#outsheet'); if (!box || !box.classList.contains('show') && !first) return;
  try {
    const r = await (await fetch('/api/outputs')).json();
    const list = box.querySelector('.oslist'), outs = r.outputs || [];
    const sig = JSON.stringify(outs.map(o => [o.name, o.default, o.muted]));
    if (sig !== outSig) {                                   // structure changed: rebuild rows
      outSig = sig; list.innerHTML = '';
      for (const o of outs) list.appendChild(outputRow(o));
    } else if (!outHold) {                                  // same rows: just sync the levels
      for (const o of outs) { const row = list.querySelector(`[data-n="${CSS.escape(o.name)}"]`); if (!row) continue;
        row.querySelector('input').value = o.percent; row.querySelector('.p').textContent = o.percent + '%'; }
    }
  } catch (e) {}
  clearTimeout(outTimer); outTimer = setTimeout(() => refreshOutputs(false), 1500);
}
function outputRow(o) {
  const row = el('div', 'osrow' + (o.default ? ' cur' : '')); row.dataset.n = o.name;
  row.innerHTML = `<div class="top"><div class="nm"><div>${escapeHtml(o.description || o.name)}</div><div class="kind">${OUT_KIND[o.kind] || ''}${o.form_factor ? ' · ' + escapeHtml(o.form_factor) : ''}</div></div>
    <button class="use" ${o.default ? 'disabled' : ''}>${o.default ? 'Current' : 'Use'}</button></div>
    <div class="lv"><button class="mu" title="Mute">${o.muted ? '🔇' : '🔊'}</button><input type="range" min="0" max="100" value="${o.percent}"><span class="p">${o.percent}%</span></div>`;
  const inp = row.querySelector('input'), pct = row.querySelector('.p'); let t = null;
  inp.addEventListener('pointerdown', () => { outHold = true; });
  const rel = () => { outHold = false; };
  inp.addEventListener('pointerup', rel); inp.addEventListener('pointercancel', rel);
  inp.addEventListener('input', () => { pct.textContent = inp.value + '%'; clearTimeout(t); t = setTimeout(() => post('/api/output/volume', { name:o.name, percent:parseInt(inp.value, 10) }), 70); });
  row.querySelector('.mu').addEventListener('click', async () => { o.muted = !o.muted; row.querySelector('.mu').textContent = o.muted ? '🔇' : '🔊'; await post('/api/output/volume', { name:o.name, muted:o.muted }); });
  row.querySelector('.use').addEventListener('click', async () => {
    const r = await post('/api/output', { name:o.name });
    if (r && r.error) toast(r.error); else { toast('Switched to ' + (o.description || o.name)); outSig = ''; refreshOutputs(true); }
  });
  return row;
}

/* ==================== polling ==================== */
let wasConnected = null;   // null = first poll, so we don't toast on startup
let wasYtm = null;
let cardDismissed = false; // set when you swipe the mini-player away
// When the app is hidden/backgrounded we barely poll (saves a lot of battery); when
// visible we poll at a normal rate. The mixer only needs a fast rate while it's on screen.
async function pollMusic() {
  if (!document.hidden) {
    let ok = false, off = false;
    try { const r = await fetch('/api/ytm/state'); const st = await r.json();
      off = !!(st && st.error === 'part_off');   // the YouTube Music remote is switched off on the computer: nothing is wrong
      ok = !!st.connected; lastConnected = ok; lastYtm = ok && st.source === 'ytm';
      $('#ndot').className = 'dot ' + (ok ? 'ok' : off ? '' : 'bad');
      paintNow(ok ? (st.now || {}) : {}, ok ? (st.queue || []) : []);
    } catch (e) { $('#ndot').className = 'dot bad'; }
    if (off) { wasConnected = null; wasYtm = lastYtm; }
    else {
      // tell the user when the link drops / comes back
      if (wasConnected === true && !ok) toast('Disconnected — reconnecting…');
      else if (wasConnected === false && ok) toast('Reconnected');
      // Settings shows connection state, so refresh it live rather than making the user
      // navigate away and back to see the change.
      if (wasConnected !== null && (wasConnected !== ok || wasYtm !== lastYtm) && (view === 'settings' || view === 'set:status')) render();
      wasConnected = ok; wasYtm = lastYtm;
    }
  }
  setTimeout(pollMusic, document.hidden ? 5000 : 1000);
}
function mixerActive() {
  return !document.hidden && (view === 'mixer' ||
    $('#app').classList.contains('railopen') ||                       // sheet shows the master slider
    document.querySelector('.widget[data-wid="mixer"], .widget[data-wid="eq"], .viz') ||
    isWide());  // desktop shows the mixer meter in the rail
}
async function pollMixer() {
  const fast = mixerActive();
  try { const r = await fetch('/api/state'); mixerState = await r.json(); applyMixer();
    if (mixerState && mixerState.parts) setParts(mixerState.parts, true);
    // Home shows "add the extension" until one has ever connected: redraw it when that changes
    const xs = mixerState && mixerState.extension, xk = xs ? (xs.everConnected ? 'seen' : 'new') : '';
    if (xk !== extKey) { const first = extKey === null; extKey = xk; if (view === 'home' && !(first && xk !== 'new')) render(); }
  } catch (e) {}
  setTimeout(pollMixer, fast ? 450 : 1200);   // always poll, just slower when nothing shows it
}

document.querySelectorAll('.navbtn').forEach(b => b.addEventListener('click', () => {
  $('#app').classList.remove('editwidgets');   // tapping a nav item saves & exits edit mode
  setView(b.dataset.view);
}));
// Album colours became the default look in 0.2.5: anyone on the old default (Dark) moves to it once; a theme chosen
// later stays.
(() => {
  let t = null;
  try { t = localStorage.getItem('vmr-theme'); if (!localStorage.getItem('vmr-look2')) { if (!t || t === 'dark') t = 'refine'; localStorage.setItem('vmr-look2', '1'); } } catch (e) {}
  applyTheme(t || 'refine');
})();
$('#app').classList.toggle('nolabels', !lsGet('vmr-navlabels', true));
// Called by the Cue shell when the device wakes — the WebView's timers get frozen while
// the screen is off, so kick everything back to life instead of sitting there stale.
window.__cueResume = async () => {
  try {
    const r = await fetch('/api/ytm/state', { cache:'no-store' }); const st = await r.json();
    lastConnected = !!st.connected; lastYtm = lastConnected && st.source === 'ytm';
    paintNow(st.connected ? (st.now || {}) : {}, st.connected ? (st.queue || []) : []);
    favPull();
  } catch (e) { toast('Disconnected — reconnecting…'); }
};
document.addEventListener('visibilitychange', () => { if (!document.hidden) window.__cueResume(); });

/* Keyboard control (desktop). Space = play/pause, arrows = seek/volume,
   shift+arrows = skip, / = search, Esc = close the now-playing sheet. */
document.addEventListener('keydown', e => {
  // e.target can be document (or a non-Element), so guard before using Element methods
  const t = e.target;
  if (t instanceof Element && t.closest('input, textarea, [contenteditable]')) return;
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  const seekTo = d => {
    if (!lastNow || !lastNow.duration) return;
    const pos = Math.max(0, Math.min(lastNow.duration, (lastNow.position || 0) + d));
    lastNow.position = pos; seekSettleUntil = Date.now() + 1600;
    ytm({ type:'transport', action:'seek', position: pos }, true);
    showHud({ label:(d > 0 ? '+' : '−') + Math.abs(d) + 's', icon:false });
  };
  const bumpVol = d => { post('/api/volume', { delta:d });
    setTimeout(() => window.__cueVolumeBump && window.__cueVolumeBump(), 160); };
  switch (e.key) {
    case ' ': case 'k': e.preventDefault(); ytm({ type:'transport', action:'playpause' }, true); break;
    case 'ArrowRight': e.preventDefault();
      if (e.shiftKey) { ytm({ type:'transport', action:'next' }, true); showHud({ label:'Next track', icon:false }); }
      else seekTo(seekSecs); break;
    case 'ArrowLeft': e.preventDefault();
      if (e.shiftKey) { ytm({ type:'transport', action:'prev' }, true); showHud({ label:'Previous track', icon:false }); }
      else seekTo(-seekSecs); break;
    case 'ArrowUp': if (!partOn('audio')) break; e.preventDefault(); bumpVol(3); break;
    case 'ArrowDown': if (!partOn('audio')) break; e.preventDefault(); bumpVol(-3); break;
    case '/': if (!partOn('remote')) break; e.preventDefault(); setView('search'); break;
    case 'Escape': if ($('#app').classList.contains('railopen')) history.back(); break;
  }
});

placePanes(); setView(view === 'settings' ? 'settings' : (isWide() ? 'queue' : 'playing')); setRailTab('queue'); pollMusic(); pollMixer(); favPull();
setInterval(favPull, 20000);   // keep favourites in step across devices
setTimeout(moveNavPill, 80);   // once layout settles, park the pill on the active tab
</script>

    const m = $('#main'); const old = $('#openytm');
    // never set up: the extension's steps come first (opening YouTube Music alone wouldn't connect anything)
    const neverSet = !!(extBrief() && !extBrief().everConnected);
    if (lastYtm || neverSet || !partOn('remote') || !['home', 'search', 'playlists'].includes(view)) { if (old) old.remove(); return; }
    if (old || !m) return;
    const b = el('div', 'openytm'); b.id = 'openytm';
    b.innerHTML = '<div class="m">YouTube Music isn\'t connected on the computer. You can open it there, then play from here.</div>';
    const btn = el('button', 'pill primary'); btn.textContent = 'Open YouTube Music on the computer';
    btn.addEventListener('click', async () => { btn.disabled = true; await post('/api/ytm', { type: 'open' }); toast('Opening YouTube Music on the computer…'); setTimeout(() => btn.disabled = false, 4000); });
    b.appendChild(btn); const tb = m.querySelector('.topbar'); if (tb && tb.nextSibling) m.insertBefore(b, tb.nextSibling); else m.prepend(b);
  }
  setInterval(openBanner, 3000);

  // ---- sleep timer ----
  const row = $('.nptrow'), sBadge = document.createElement('span'); sBadge.id = 'sleepbadge';
  const sBtn = document.createElement('button'); sBtn.id = 'np-sleep'; sBtn.className = 'npfav'; sBtn.title = 'Sleep timer';
  sBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12.3 3a9 9 0 109 11.3A7 7 0 0112.3 3z"/></svg>';
  row.insertBefore(sBadge, $('#np-like')); row.insertBefore(sBtn, $('#np-like'));
  const menu = document.createElement('div'); menu.id = 'sleepmenu'; document.body.appendChild(menu);
  let sleepLeft = 0, sleepAt = 0, lastMs = null;
  async function setSleep(minutes) { const r = await post('/api/sleep', { minutes }); if (r && r.error) toast(r.error); else { sleepLeft = (r && r.remainingSec) || 0; sleepAt = Date.now(); toast(sleepLeft ? 'Sleep timer set' : 'Sleep timer off'); } paintSleep(); }
  function paintSleep() {
    const left = sleepLeft ? Math.max(0, sleepLeft - Math.floor((Date.now() - sleepAt) / 1000)) : 0;
    sBadge.textContent = left ? (left >= 3600 ? Math.floor(left / 3600) + 'h ' + Math.floor(left % 3600 / 60) + 'm' : left >= 60 ? Math.ceil(left / 60) + 'm' : left + 's') : '';
    sBtn.classList.toggle('on', !!left);
    const caps = mixerState && mixerState.capabilities; sBtn.style.display = (caps && caps.sleep) ? 'flex' : 'none';
    if (mixerState && mixerState !== lastMs) { lastMs = mixerState; const r = mixerState.sleep && mixerState.sleep.remainingSec || 0;
      if (!sleepLeft || Math.abs((sleepLeft - (Date.now() - sleepAt) / 1000) - r) > 3) { sleepLeft = r; sleepAt = Date.now(); } if (!r) sleepLeft = 0; }
  }
  setInterval(paintSleep, 1000);
  sBtn.addEventListener('click', e => { e.stopPropagation(); menu.innerHTML = '<div class="h">Pause playback after…</div>';
    for (const m of [15, 30, 45, 60, 90, 120]) { const b = document.createElement('button'); b.textContent = m + ' minutes'; b.onclick = () => { menu.classList.remove('show'); setSleep(m); }; menu.appendChild(b); }
    const t = document.createElement('button'); t.textContent = 'When this song ends'; t.onclick = () => { menu.classList.remove('show'); setSleep('track'); }; menu.appendChild(t);
    if (sleepLeft) { const o = document.createElement('button'); o.textContent = 'Turn off'; o.onclick = () => { menu.classList.remove('show'); setSleep(0); }; menu.appendChild(o); }
    const r = sBtn.getBoundingClientRect(); menu.style.left = Math.max(8, Math.min(innerWidth - 210, r.left - 80)) + 'px'; menu.style.top = Math.min(innerHeight - 330, r.bottom + 6) + 'px'; menu.classList.add('show'); });
  document.addEventListener('click', () => menu.classList.remove('show'));

  // ---- settings: look, and other players ----
  const _settings = renderSettings;
  renderSettings = function (m) {
    _settings.apply(this, arguments);
    const mkSel = (title, desc, key, opts) => { const r = el('div', 'setrow'); r.innerHTML = '<div><div class="k"></div><div class="d"></div></div>';
      r.querySelector('.k').textContent = title; r.querySelector('.d').textContent = desc;
      const sel = document.createElement('select'); sel.style.cssText = 'height:38px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card);color:var(--text);padding:0 8px';
      for (const [v, l] of opts) { const o = document.createElement('option'); o.value = v; o.textContent = l; sel.appendChild(o); } sel.value = P[key];
      sel.addEventListener('change', () => savePref(key, sel.value)); r.appendChild(sel); return r; };
    const mkTog = (title, desc, on, fn) => { const r = el('div', 'setrow'); r.innerHTML = '<div><div class="k"></div><div class="d"></div></div>';
      r.querySelector('.k').textContent = title; r.querySelector('.d').textContent = desc;
      const t = el('button', 'toggle' + (on ? ' on' : '')); t.addEventListener('click', () => { const n = !t.classList.contains('on'); t.classList.toggle('on', n); fn(n); }); r.appendChild(t); return r; };
    // Sections go where they belong: look settings under Appearance, the nav style with the other nav setting,
    // other players with playback, and About last.
    const sec = (t) => [...m.querySelectorAll('.setsec')].find(x => (x.querySelector('h3') || {}).textContent === t);
    const putAfter = (ref, node) => { if (ref && ref.parentNode === m) m.insertBefore(node, ref.nextSibling); else m.appendChild(node); };
    const fx = el('div', 'setsec'); fx.appendChild(Object.assign(el('h3'), { textContent: 'Effects' }));
    fx.append(
      mkSel('Cover glow', "A soft light of the cover's colours around the album art.", 'glow', [['off', 'Off'], ['soft', 'Soft'], ['strong', 'Strong'], ['extreme', 'Extreme']]),
      mkSel('Cover shape', 'Circle spins slowly like a record.', 'shape', [['rounded', 'Rounded'], ['soft', 'Soft'], ['circle', 'Circle'], ['cut', 'Cut corners']]),
      mkTog('Wavy seek bar', 'The played part of the bar ripples while music plays.', P.wavy, v => savePref('wavy', v)));
    putAfter(sec('Appearance'), fx);
    const navSel = mkSel('Navigation bar (phone)', 'Classic keeps the bar along the bottom; Pill floats above the content.', 'nav', [['bar', 'Classic bar'], ['pill', 'Floating pill']]);
    const iface = sec('Interface'); if (iface) iface.appendChild(navSel); else fx.appendChild(navSel);
    const op = el('div', 'setsec'); op.appendChild(Object.assign(el('h3'), { textContent: 'Other players' }));
    const tog = mkTog('Pause other players when YouTube Music starts', 'Other music or video playing on the computer is paused when a YouTube Music song starts.', false, v => post('/api/prefs', { pauseOthers: v }));
    op.appendChild(tog);
    fetch('/api/prefs').then(r => r.json()).then(j => tog.querySelector('.toggle').classList.toggle('on', !!j.pauseOthers)).catch(() => {});
    const nb = el('div', 'setrow'); nb.innerHTML = '<div><div class="k">Pause other players now</div><div class="d">Pauses everything else that is playing on the computer.</div></div>';
    const btn = el('button', 'pill ghost'); btn.textContent = 'Pause'; btn.style.height = '38px';
    btn.addEventListener('click', async () => { const r = await post('/api/media/pause-others', {}); toast(r && r.paused && r.paused.length ? 'Paused ' + r.paused.join(', ') : 'Nothing else was playing'); });
    nb.appendChild(btn); op.appendChild(nb); putAfter(sec('Playback'), op);

    // ---- About: the version on the computer, whether a newer one is out, and the Android app ----
    const ab = el('div', 'setsec'); ab.appendChild(Object.assign(el('h3'), { textContent: 'About' }));
    const ver = el('div', 'setrow'); ver.innerHTML = '<div><div class="k">YTM Starcast</div><div class="d">Checking for updates…</div></div>';
    ab.appendChild(ver); m.appendChild(ab);
    fetch('/api/update', { cache: 'no-store' }).then(r => r.json()).then(u => {
      if (view !== 'settings' && !view.startsWith('set:')) return;
      // "v0.2.1-alpha" -> "0.2.1 alpha"; older names ("0.2.0-alpha.10", "0.2.0a10") keep their number
      const pretty = (v) => { const x = String(v || '').replace(/^v/, '').match(/^(\d+\.\d+\.\d+)(?:[-._]?(alpha|beta|rc|a|b)(?:[-._]?(\d+))?)?$/i);
        const stage = x && x[2] ? ({ a:'alpha', b:'beta' }[x[2].toLowerCase()] || x[2].toLowerCase()) : '';
        return x ? x[1] + (stage ? ' ' + stage + (x[3] ? ' ' + x[3] : '') : '') : String(v || ''); };
      ver.querySelector('.k').textContent = 'YTM Starcast ' + pretty(u.current);
      ver.querySelector('.d').textContent = u.error ? "Couldn't check for updates right now."
        : u.available ? pretty(u.latest) + ' is out. Update it on the computer (ytm-starcast --update, or the YTM Starcast window).'
        : 'Up to date.';
      if (u.apk) {
        const ap = el('div', 'setrow');
        ap.innerHTML = '<div><div class="k">Android app</div><div class="d">The native app for Android phones and tablets: lock-screen and volume-key ' +
          'controls, home-screen widgets, and music on the phone itself. Downloaded through the computer and checked against the release.</div></div>';
        const a = el('a', 'pill ghost'); a.textContent = 'Download'; a.href = '/api/update/apk'; a.style.cssText = 'height:38px;text-decoration:none;display:inline-flex;align-items:center';
        ap.appendChild(a); ab.appendChild(ap);
      }
    }).catch(() => { ver.querySelector('.d').textContent = "Couldn't check for updates right now."; });
  };
  // set the view for an already-open artist/settings page
  if (view === 'settings' || view === 'artist') render();
})();

// Settings as in the Android app: a list of categories, each a page of its own (views "set:<key>"). The sections
// themselves are built as before; a category's page keeps its own and leaves the others out.
(() => {
  const I = (d) => '<svg viewBox="0 0 24 24"><path d="' + d + '"/></svg>';
  const ICON = {
    sound: I('M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z'),
    playback: I('M12 2a10 10 0 100 20 10 10 0 000-20zm-2 14.5v-9l6 4.5z'),
    appearance: I('M12 3a9 9 0 000 18c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01a1.5 1.5 0 011.13-2.49H16a5 5 0 005-5c0-4.42-4.03-8-9-8zm-5.5 9a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm3-4a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm5 0a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm3 4a1.5 1.5 0 110-3 1.5 1.5 0 010 3z'),
    parts: I('M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42A6.92 6.92 0 0119 12a7 7 0 11-11.42-5.42L6.17 5.17A8.93 8.93 0 003 12a9 9 0 0018 0c0-2.74-1.23-5.18-3.17-6.83z'),
    extension: I('M20.5 11H19V7a2 2 0 00-2-2h-4V3.5a2.5 2.5 0 00-5 0V5H4a2 2 0 00-2 2v3.8h1.5a2.7 2.7 0 010 5.4H2V20a2 2 0 002 2h3.8v-1.5a2.7 2.7 0 015.4 0V22H17a2 2 0 002-2v-4h1.5a2.5 2.5 0 000-5z'),
    devices: I('M3 11h8V3H3v8zm2-6h4v4H5V5zm8-2v8h8V3h-8zm6 6h-4V5h4v4zM3 21h8v-8H3v8zm2-6h4v4H5v-4zm13-2h-2v3h-3v2h3v3h2v-3h3v-2h-3z'),
    discord: I('M20 2H4a2 2 0 00-2 2v18l4-4h14a2 2 0 002-2V4a2 2 0 00-2-2z'),
    status: I('M19 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V5a2 2 0 00-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z'),
    about: I('M11 7h2v2h-2zm0 4h2v6h-2zm1-9a10 10 0 100 20 10 10 0 000-20zm0 18a8 8 0 110-16 8 8 0 010 16z'),
  };
  // [key, title, the sections it holds (titles; a RegExp for one whose name varies) or the view it opens]
  const GROUPS = [
    ['Listening', [['sound', 'Sound & outputs', 'mixer'], ['playback', 'Playback', ['Playback', 'Other players', /engine$/]]]],
    ['Look & feel', [['appearance', 'Appearance', ['Appearance', 'Effects', 'Interface', 'Display']]]],
    ['Connections', [['parts', 'Parts', ['Parts']], ['extension', 'Browser extension', ['Browser extension']],
      ['devices', 'Open on another device', ['Open on another device']], ['discord', 'Discord status', ['Discord status']]]],
    ['More', [['status', 'Status', ['Status', 'Cue app']], ['about', 'About', ['About']]]],
  ];
  const CATS = GROUPS.flatMap(g => g[1]);
  const holds = (cat, title) => Array.isArray(cat[2]) && cat[2].some(x => x instanceof RegExp ? x.test(title) : x === title);
  const summary = (key) => {
    const st = mixerState || {}, v = st.volume || {}, x = st.extension || {}, p = st.parts || {};
    switch (key) {
      case 'sound': return v.available ? v.percent + '%' + (v.muted ? ' (muted)' : '') + (v.device ? ' · ' + v.device : '') : "The computer's volume, outputs and equalizer";
      case 'playback': return 'Seeking, keyboard shortcuts, other players';
      case 'appearance': {
        const t = localStorage.getItem('vmr-theme') || 'dark';
        return ((THEMES.find(x => x[0] === t) || [])[1] || (customThemes().find(c => c.id === t) || {}).name || 'Dark') + ' theme, effects, layout';
      }
      case 'parts': { const off = PARTS.filter(([k]) => p[k] === false).map(([, l]) => l); return off.length ? 'Off: ' + off.join(', ') : 'Everything is on'; }
      case 'extension': return x.connected ? 'Connected' + (x.version ? ' · version ' + x.version : '') : 'Not connected';
      case 'devices': return 'Addresses and a QR code for your phone';
      case 'discord': return 'Your music on your Discord profile';
      case 'status': return lastConnected ? (lastYtm ? 'YouTube Music connected' : 'Connected') : 'Not connected';
      case 'about': return (st.version ? 'Version ' + st.version : 'Version') + ', updates and the Android app';
    }
    return '';
  };
  const overview = (m) => {
    m.innerHTML = ''; m.appendChild(topbar('Settings'));
    for (const [group, cats] of GROUPS) {
      const box = el('div', 'setgroup');
      box.appendChild(Object.assign(el('h3'), { textContent: group }));
      const card = el('div', 'setcard');
      for (const c of cats) {
        if (c[0] === 'sound' && !partOn('audio')) continue;
        if ((c[0] === 'discord') && !((mixerState && mixerState.capabilities) || {}).discord && !((mixerState && mixerState.capabilities) || {}).beacon) continue;
        const r = el('button', 'setcat');
        r.innerHTML = '<span class="ic">' + ICON[c[0]] + '</span><span class="tx"><span class="k"></span><span class="d"></span></span>' +
          '<svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6z"/></svg>';
        r.querySelector('.k').textContent = c[1]; r.querySelector('.d').textContent = summary(c[0]);
        r.addEventListener('click', () => setView(c[2] === 'mixer' ? 'mixer' : 'set:' + c[0]));
        card.appendChild(r);
      }
      box.appendChild(card); m.appendChild(box);
    }
  };
  const full = renderSettings;
  renderSettings = function (m) {
    if (!view.startsWith('set:')) return overview(m);
    const cat = CATS.find(c => c[0] === view.slice(4));
    const out = full.apply(this, arguments);
    if (!cat) return out;
    const h = m.querySelector('.topbar .viewtitle'); if (h) h.textContent = cat[1];
    // leave out the other categories' sections, including ones added a moment later
    const sort = () => m.querySelectorAll(':scope > .setsec').forEach(s => {
      const t = (s.querySelector('h3') || {}).textContent || '';
      s.classList.toggle('offcat', !holds(cat, t));
      const h3 = s.querySelector('h3');      // the page is named after its category: a lone section needs no heading
      if (h3) h3.classList.toggle('samecat', cat[2].length === 1);
    });
    sort();
    const mo = new MutationObserver(sort);
    mo.observe(m, { childList: true });
    const stop = () => { if (!view.startsWith('set:') || !m.isConnected) mo.disconnect(); };
    setTimeout(function chk() { stop(); if (view.startsWith('set:')) setTimeout(chk, 1500); }, 1500);
    return out;
  };
  if (view === 'settings' || view.startsWith('set:')) render();
})();
</script>
