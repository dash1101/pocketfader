<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<!-- covers and icons load from Google and GitHub: they are not told the address this page was opened at -->
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<meta name="application-name" content="YTM Starcast">
<meta name="apple-mobile-web-app-title" content="YTM Starcast">
<meta name="description" content="Your YouTube Music companion: a remote for your phone, your music as your Discord status, and a better YouTube Music.">
<title>YTM Starcast</title>
<style>
  :root {
    --bg:#0a0a0c; --panel:#131318; --card:#1a1a21; --card2:#20212a; --line:#2b2c37;
    --text:#f0f1f6; --dim:#9a9cab; --dim2:#6b6d7c;
    --accent:#8b5cf6; --accent2:#b69cff; --live:#3fb950; --danger:#f85149; --warn:#d29922;
    --radius:var(--r-lg);
    /* the shared scale (docs/DESIGN.md): corners, how long things take, how they move */
    --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:24px; --r-xl:28px; --r-full:999px;
    --t-quick:.12s; --t-short:.2s; --t-medium:.3s; --t-long:.45s;
    /* tonal colours, as in Refine (Material You): a container for what is chosen, the text on it, the text on the accent */
    --container:color-mix(in srgb, var(--accent) 30%, var(--card)); --on-container:color-mix(in srgb, var(--accent) 30%, var(--text));
    --on-accent:#0a0512; --glow:color-mix(in srgb, var(--accent) 55%, transparent);
  }
  /* ---------- themes ---------- */
  :root[data-theme="light"]{ --bg:#f5f6fa; --panel:#ffffff; --card:#eceef4; --card2:#e0e3ec; --line:#d2d6e0;
    --text:#181920; --dim:#5b6474; --dim2:#8b93a4; --accent:#7c3aed; --accent2:#6d28d9; --live:#12a150; --danger:#e5484d; --warn:#b7791f; }
  :root[data-theme="oled"]{ --bg:#000000; --panel:#070708; --card:#0e0e11; --card2:#161619; --line:#242429; }
  :root[data-theme="space"]{ --bg:#080a1e; --panel:#0d1030; --card:#141838; --card2:#1c2150; --line:#2a2f66;
    --text:#e9ebff; --dim:#9aa0d4; --dim2:#6a6fa8; --accent:#6d8bff; --accent2:#9db3ff; --live:#3fe0c0; }
  :root[data-theme="sunset"]{ --bg:#190d12; --panel:#241318; --card:#2e181e; --card2:#3b2027; --line:#4d2b32;
    --text:#ffeef1; --dim:#d6a9ad; --dim2:#a07a7e; --accent:#ff7a52; --accent2:#ffa07a; --live:#ffbb4d; }
  :root[data-theme="forest"]{ --bg:#091311; --panel:#0e1c17; --card:#13261e; --card2:#193026; --line:#254537;
    --text:#e9f5ec; --dim:#9cc0a9; --dim2:#6f9a7f; --accent:#37b978; --accent2:#5fd196; --live:#7ee0a0; }
  :root[data-theme="rose"]{ --bg:#160a11; --panel:#22101a; --card:#2c1522; --card2:#391b2b; --line:#4b2639;
    --text:#ffeef7; --dim:#d6a9c1; --dim2:#a07a90; --accent:#f06baf; --accent2:#ff92c6; --live:#ff8fc4; }
  :root[data-theme="space"] body { background-image:
    radial-gradient(1100px 560px at 82% -12%, rgba(109,139,255,.18), transparent 60%),
    radial-gradient(820px 480px at 8% 112%, rgba(150,120,255,.15), transparent 55%); background-attachment:fixed; }

  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font:15px/1.5 -apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
    -webkit-user-select:none; user-select:none; overflow:hidden;
  }
  button { font:inherit; color:inherit; cursor:pointer; }
  img { display:block; }

  /* ---------- app shell ---------- */
  #app {
    display:grid; height:100dvh;
    grid-template-columns:84px 1fr minmax(320px, 400px);
    grid-template-areas:"nav main rail";
  }
  /* mini-player only exists on mobile */
  #miniplayer { display:none; }
  /* narrow / phone layout */
  @media (max-width:819px), (max-width:1100px) and (max-height:599px), (max-width:1100px) and (orientation:portrait) {
    #app { grid-template-columns:1fr; grid-template-rows:1fr; grid-template-areas:"main"; }
    #main { grid-area:main; padding:0 16px calc(180px + var(--sa-bottom, env(safe-area-inset-bottom))); }
    /* the sheet grows out of the mini-player: scale + fade up from the bottom */
    /* the chip is hidden by CSS whenever the sheet is open, so no inline state can stick */
    #app.railopen #miniplayer { opacity:0; pointer-events:none; }
    #rail { position:fixed; inset:0; z-index:60; border-left:0; transform-origin:50% 50%;
            transform:none; opacity:0; pointer-events:none; transition:none; }
    /* No CSS transition on #rail — the morph is driven entirely from JS. With one, the moment
       the inline clip-path was cleared the sheet snapped to full screen and faded out over
       ~0.26s: that was the flash on close. */
    #app.railopen #rail { transform:none; opacity:1; pointer-events:auto; }
    #app.railopen { overflow:hidden; }
    /* on the phone sheet the whole thing scrolls — no sticky player for the queue to slide behind */
    #rail .np { position:static; box-shadow:none; }
    /* mini player pinned above the bottom nav */
    #miniplayer { display:flex; position:fixed; left:10px; right:10px; z-index:45;
                  bottom:calc(84px + var(--sa-bottom, env(safe-area-inset-bottom))); height:64px; align-items:center; gap:8px;
                  padding:10px; border-radius:var(--r-md); background:var(--card2); border:1px solid var(--line);
                  box-shadow:0 8px 24px rgba(0,0,0,.4); }
    #mini-art { width:44px; height:44px; border-radius:var(--r-xs); object-fit:cover; background:var(--panel); flex:none; }
    #miniplayer .mm { flex:1; min-width:0; }
    #mini-t { font-size:13.5px; font-weight:640; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #mini-s { font-size:11.5px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #mini-pp { width:44px; height:44px; flex:none; border:0; background:var(--accent); color:#0a0512; border-radius:var(--r-sm);
               display:flex; align-items:center; justify-content:center; }
    #mini-pp svg { width:22px; height:22px; fill:currentColor; }
    .railclose { display:none; }   /* swipe down to dismiss instead */
  }
  @media (min-width:1101px), (min-width:820px) and (min-height:600px) and (orientation:landscape) { .railclose { display:none; } }

  /* ---------- nav ---------- */
  #nav { grid-area:nav; position:relative; background:var(--panel); border-right:1px solid var(--line);
         display:flex; flex-direction:column; align-items:center; gap:6px; padding:16px 0; }
  #nav .brand { width:40px; height:40px; border-radius:var(--r-sm); margin-bottom:16px; flex:none; position:relative;
                overflow:hidden; background:linear-gradient(140deg, var(--accent2), var(--accent) 55%, #4f7cff);
                box-shadow:0 5px 16px color-mix(in srgb, var(--accent) 45%, transparent), inset 0 1px 0 rgba(255,255,255,.4);
                display:flex; align-items:center; justify-content:center; }
  #nav .brand::after { content:''; position:absolute; inset:0; background:linear-gradient(155deg, rgba(255,255,255,.45), rgba(255,255,255,0) 45%); }
  #nav .brand svg { width:22px; height:22px; fill:#fff; position:relative; filter:drop-shadow(0 1px 1px rgba(0,0,0,.25)); }
  .navbtn { width:66px; height:62px; border:0; background:transparent; border-radius:var(--r-sm);
            color:var(--dim); display:flex; flex-direction:column; align-items:center;
            justify-content:center; gap:5px; font-size:10.5px; font-weight:600; position:relative; }
  .navbtn svg { width:23px; height:23px; fill:currentColor; }
  /* glassy selected state */
  .navbtn.sel { color:var(--text);
    background:linear-gradient(140deg, color-mix(in srgb, var(--accent) 26%, transparent), color-mix(in srgb, var(--accent) 7%, transparent));
    border:1px solid color-mix(in srgb, var(--accent) 34%, transparent);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 4px 14px color-mix(in srgb, var(--accent) 22%, transparent);
    backdrop-filter:blur(6px); }
  .navbtn.sel svg { filter:drop-shadow(0 0 6px color-mix(in srgb, var(--accent) 60%, transparent)); }
  .navbtn:active { transform:scale(var(--press-icon)); }
  #nav .spacer { flex:1; }
  #nav .dot { width:9px; height:9px; border-radius:50%; background:var(--dim2); margin-top:6px; }
  #nav .dot.ok { background:var(--live); box-shadow:0 0 8px var(--live); }
  #nav .dot.bad { background:var(--danger); }
  @media (max-width:819px), (max-width:1100px) and (max-height:599px), (max-width:1100px) and (orientation:portrait) {
    #nav { position:fixed; left:0; right:0; bottom:0; z-index:50; flex-direction:row; justify-content:space-around;
           border-right:0; border-top:1px solid var(--line); background:var(--panel);
           padding:6px 0 calc(6px + var(--sa-bottom, env(safe-area-inset-bottom))); }
    #nav .brand, #nav .spacer, #nav .dot { display:none; }
    .navbtn { width:auto; flex:1; height:52px; }
  }

  /* ---------- main ---------- */
  #main { grid-area:main; overflow-y:auto; overflow-x:hidden; padding:0 26px 40px; }
  #main::-webkit-scrollbar { width:10px; } #main::-webkit-scrollbar-thumb { background:#2c2d38; border-radius:8px; }
  /* sticky header sits flush at the scroll top (its own padding, none on #main) so nothing
     can peek above it, and content fades out as it slides underneath */
  .topbar { display:flex; align-items:center; gap:14px; margin-bottom:18px; position:sticky; top:0;
            background:var(--bg); padding:16px 0 12px; z-index:8; }
  .topbar::after { content:''; position:absolute; left:0; right:0; top:100%; height:26px; pointer-events:none;
                   background:linear-gradient(var(--bg), transparent); }
  .backbtn { width:40px; height:40px; border:0; border-radius:var(--r-sm); background:var(--card); color:var(--dim); flex:none;
             display:flex; align-items:center; justify-content:center; transition:background .15s, transform .12s; }
  .backbtn:active { background:var(--card2); transform:scale(var(--press-icon)); }
  .backbtn svg { width:20px; height:20px; fill:currentColor; }
  h2.viewtitle { font-size:26px; font-weight:720; letter-spacing:-.02em; margin:0; flex:none; }
  #searchform { flex:1; display:flex; }
  #searchbox { flex:1; height:46px; border-radius:var(--r-full); border:1px solid var(--line);
               background:var(--card); color:var(--text); padding:0 16px; font-size:15px; outline:none; }
  #searchbox:focus { border-color:var(--accent); }

  .shelf { margin-bottom:30px; }
  .shelf h3 { font-size:17px; font-weight:680; margin:0 0 12px; letter-spacing:-.01em; }
  .row { display:flex; gap:14px; overflow-x:auto; padding-bottom:6px; scroll-snap-type:x proximity; }
  .row::-webkit-scrollbar { height:8px; } .row::-webkit-scrollbar-thumb { background:#2c2d38; border-radius:8px; }
  .tile { width:150px; flex:none; scroll-snap-align:start; }
  .tile .art { width:150px; height:150px; border-radius:var(--r-md); object-fit:cover; background:var(--card2);
               box-shadow:0 6px 18px rgba(0,0,0,.35); }
  .tile.round .art { border-radius:50%; }
  .thumb { position:relative; }
  .playover { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; opacity:0;
              background:rgba(0,0,0,.34); border-radius:var(--r-sm); transition:opacity .18s; pointer-events:none; }
  .playover svg { width:40px; height:40px; fill:#fff; filter:drop-shadow(0 2px 8px rgba(0,0,0,.6)); }
  .li .thumb .playover svg { width:24px; height:24px; }
  .li .thumb .playover { border-radius:var(--r-xs); }
  .tile:hover .playover, .li:hover .playover, .qitem:hover .playover { opacity:1; }
  @media (hover:none) { .playover { display:none; } }  /* touch: use long-press instead */
  .tile .t { font-size:13px; font-weight:600; margin-top:9px; line-height:1.3;
             display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .tile .s { font-size:11.5px; color:var(--dim); margin-top:2px; overflow:hidden;
             text-overflow:ellipsis; white-space:nowrap; }

  .list { display:flex; flex-direction:column; }
  .li { display:flex; align-items:center; gap:14px; padding:9px 8px; border-radius:var(--r-sm); }
  .li:active { background:var(--card); }
  .li .art { width:52px; height:52px; border-radius:var(--r-xs); object-fit:cover; background:var(--card2); flex:none; }
  .li .meta { flex:1; min-width:0; }
  .li .t { font-size:14.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .li .s { font-size:12.5px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .li .kind { font-size:10px; color:var(--dim2); text-transform:uppercase; letter-spacing:.05em; margin-left:4px; }
  .li .more { width:40px; height:40px; border-radius:var(--r-sm); border:0; background:transparent; color:var(--dim);
              display:flex; align-items:center; justify-content:center; flex:none; }
  .li .more:active { background:var(--card2); }
  .li .more svg { width:20px; height:20px; fill:currentColor; }

  .detailhead { display:flex; gap:20px; align-items:flex-end; margin-bottom:20px; }
  .detailhead .art { width:180px; height:180px; border-radius:var(--r-sm); object-fit:cover;
                     box-shadow:0 10px 30px rgba(0,0,0,.5); flex:none; }
  .detailhead .t { font-size:28px; font-weight:760; letter-spacing:-.02em; }
  .detailhead .s { color:var(--dim); margin-top:4px; }
  .detailhead .acts { display:flex; gap:10px; margin-top:16px; }
  .pill { height:44px; padding:0 20px; border-radius:var(--r-full); border:0; font-weight:650; font-size:14px;
          display:inline-flex; align-items:center; gap:8px; }
  .pill svg { width:18px; height:18px; fill:currentColor; }
  .pill.primary { background:var(--accent); color:#0a0512; }
  .pill.ghost { background:var(--card2); color:var(--text); }
  .pill:active { filter:brightness(1.15); }

  .empty { color:var(--dim); text-align:center; padding:60px 20px; font-size:14px; }
  .recenthead { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .recentchips { display:flex; flex-wrap:wrap; gap:8px; margin:4px 0 14px; }
  .recentchip { height:34px; padding:0 14px; border-radius:var(--r-xs); border:1px solid var(--line); background:var(--card); color:var(--text);
                font-size:13.5px; cursor:pointer; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
                transition:border-radius var(--t-short) var(--ease), background-color var(--t-short), border-color var(--t-short); }
  .recentchip:hover { border-color:color-mix(in srgb, var(--accent) 50%, var(--line)); }
  /* what a search looks for: one row that scrolls sideways on a narrow screen instead of wrapping */
  .searchfilters { display:flex; gap:8px; margin:0 0 12px; overflow-x:auto; scrollbar-width:none; }
  .searchfilters::-webkit-scrollbar { display:none; }
  .searchfilters .recentchip { flex:none; }
  /* a chip is softly squared, and rounds off into a pill once it is chosen (half its height, so the change shows all the way) */
  .searchfilters .recentchip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#0a0512; font-weight:700; border-radius:17px; }
  .li.artist .art, .li.artist .thumb .playover { border-radius:50%; }
  .homeempty { grid-column:1 / -1; text-align:center; padding:48px 20px; max-width:460px; margin:0 auto; }
  .homeempty .t { font-size:20px; font-weight:800; margin-bottom:8px; }
  .homeempty .d { color:var(--dim); font-size:14px; line-height:1.5; margin-bottom:20px; }
  .homeempty .acts { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .spinner { width:26px; height:26px; border:3px solid var(--line); border-top-color:var(--accent);
             border-radius:50%; animation:spin .8s linear infinite; margin:60px auto; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* ---------- right rail ---------- */
  #rail { grid-area:rail; background:var(--panel); border-left:1px solid var(--line);
          display:flex; flex-direction:column; overflow-y:auto; overflow-x:hidden; }
  #rail::-webkit-scrollbar { width:8px; } #rail::-webkit-scrollbar-thumb { background:#2c2d38; border-radius:8px; }
  .railclose { display:none; position:absolute; top:12px; right:14px; z-index:9; width:38px; height:38px; border:0;
               border-radius:50%; background:rgba(0,0,0,.45); color:#fff; align-items:center; justify-content:center; }
  .railclose svg { width:22px; height:22px; fill:currentColor; }
  .np { padding:22px 20px 12px; flex:none; position:sticky; top:0; z-index:5; background:var(--panel);
        transition:padding var(--t-long) var(--ease), box-shadow .42s ease, gap .42s ease; }
  .artwrap { transition:max-height var(--t-long) var(--ease), width var(--t-long) var(--ease),
             margin var(--t-long) var(--ease); max-height:420px; overflow:hidden; margin:0 auto; }
  /* collapsed: pin a compact now-playing bar (thumb + title + play/pause) to the top */
  #rail.collapsed .np { display:flex; flex-wrap:wrap; align-items:center; gap:12px; padding:12px 16px;
                        box-shadow:0 8px 20px rgba(0,0,0,.28); }
  #rail.collapsed .artwrap { max-height:50px; width:50px; margin:0; }
  #rail.collapsed .np .t { font-size:14px; margin:0; flex:1; min-width:0; }
  #rail.collapsed .np .s, #rail.collapsed .seek, #rail.collapsed .ytvol,
  #rail.collapsed #r-prev, #rail.collapsed #r-next { display:none; }
  #rail.collapsed .transport { margin:0; width:auto; flex:none; }
  #rail.collapsed #r-pp { width:46px; height:46px; flex:none; }
  .np .art { width:100%; aspect-ratio:1; border-radius:var(--r-xl); object-fit:cover; background:var(--card2);
             box-shadow:0 12px 34px rgba(0,0,0,.5); position:relative; z-index:1; }
  .li .thumb, .qitem .thumb { flex:none; }
  /* album-art glow — a blurred copy of the cover behind the now-playing art */
  .artstage { position:relative; }
  #np-glow { position:absolute; inset:5% 5% -4% 5%; z-index:0; background-size:cover; background-position:center;
             filter:blur(36px) saturate(1.7); opacity:.5; border-radius:30px; pointer-events:none;
             transition:opacity .55s ease, background-image .5s ease; }
  #rail.collapsed #np-glow { opacity:0; }
  .artwrap { z-index:1; }
  /* subtle art glow on hover for tiles */
  .tile:hover .art { box-shadow:0 16px 34px rgba(0,0,0,.5), 0 0 26px color-mix(in srgb, var(--accent) 34%, transparent); }
  /* ambient accent glow on the main interactive elements */
  #r-pp, #mini-pp, .wcbtns .pp { box-shadow:0 6px 22px color-mix(in srgb, var(--accent) 45%, transparent); }
  .pill.primary { box-shadow:0 5px 18px color-mix(in srgb, var(--accent) 40%, transparent); }
  .npfav.on { filter:drop-shadow(0 0 8px color-mix(in srgb, var(--accent) 70%, transparent)); }
  .themecard.sel { box-shadow:0 0 18px color-mix(in srgb, var(--accent) 45%, transparent); }
  .qitem.cur { box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--accent) 26%, transparent); }
  #miniplayer { box-shadow:0 8px 24px rgba(0,0,0,.4), 0 0 22px color-mix(in srgb, var(--accent) 16%, transparent); }
  .np .art.idle { display:flex; align-items:center; justify-content:center; color:var(--dim2); font-size:13px; }
  .nptrow { display:flex; align-items:center; gap:8px; margin-top:16px; }
  .np .nptrow .t { flex:1; min-width:0; white-space:normal; display:-webkit-box; -webkit-box-orient:vertical;
               -webkit-line-clamp:2; line-clamp:2; line-height:1.25; word-break:break-word; }
  .np .t { font-size:18px; font-weight:700; letter-spacing:-.01em;
           overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #rail.collapsed .np .nptrow .t { -webkit-line-clamp:1; line-clamp:1; white-space:nowrap; display:block; }
  .npfav { width:36px; height:36px; border:0; background:transparent; color:var(--dim); flex:none; border-radius:50%;
           display:flex; align-items:center; justify-content:center; transition:transform .12s, color .15s; }
  .npfav:active { transform:scale(var(--press-icon)); }
  .npfav svg { width:21px; height:21px; fill:currentColor; }
  .npfav.on { color:var(--accent); } .npfav.on svg path { fill:var(--accent); stroke:var(--accent); }
  /* like: outline when not liked, filled accent when liked — so the state is obvious */
  #np-like svg path { fill:none; stroke:currentColor; stroke-width:1.7; }
  #np-like.on svg path { fill:var(--accent); stroke:var(--accent); }
  #rail.collapsed .nptrow { margin:0; flex:1; min-width:0; }
  /* soft fade at the top & bottom of the scroll areas */
  /* NOTE: no mask on #main — it creates a containing block that breaks the sticky header. */
  .railbody { -webkit-mask-image:linear-gradient(to bottom, transparent, #000 12px, #000 calc(100% - 18px), transparent);
              mask-image:linear-gradient(to bottom, transparent, #000 12px, #000 calc(100% - 18px), transparent); }
  /* mobile: a drag handle atop the now-playing sheet */
  .raildrag { display:none; }
  @media (max-width:819px), (max-width:1100px) and (max-height:599px), (max-width:1100px) and (orientation:portrait) {
    .raildrag { display:block; width:40px; height:5px; border-radius:3px; background:var(--dim2); opacity:.6;
                margin:8px auto 2px; flex:none; }
    /* let the drag own the gesture instead of the scroller stealing it mid-swipe */
    .raildrag, .artstage, .nptrow { touch-action:none; }
  }
  .np .s { font-size:13.5px; color:var(--dim); margin-top:3px;
           overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .seek { margin-top:16px; }
  .seek input { width:100%; accent-color:var(--accent); height:26px; margin:0; }
  .times { display:flex; justify-content:space-between; color:var(--dim); font-size:11.5px;

  /* action sheet */

  #sheethead { display:flex; align-items:center; gap:12px; padding:12px 12px 14px; }
  #sheethead .art { width:52px; height:52px; border-radius:var(--r-xs); object-fit:cover; background:var(--card2); }
  #sheethead .t { font-weight:660; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

           font-size:14px; opacity:0; transition:.25s; pointer-events:none; z-index:60; }

  /* ---------- animations / pop ---------- */
  body { transition:background-color .45s ease, color .3s ease; }

  #main.viewin { animation:viewin var(--t-medium) var(--ease); }

  /* ---------- independent YT Music volume (rail) ---------- */

                    border-radius:var(--r-full); padding:3px 10px; white-space:nowrap; }

              border-radius:var(--r-sm); margin-bottom:10px; }

  .connside { flex:1; min-width:190px; display:flex; flex-direction:column; gap:8px; }

              border-radius:var(--r-xs); padding:9px 12px; font:inherit; cursor:pointer; }

  .toggle::after { content:''; position:absolute; top:3px; left:3px; width:21px; height:21px; border-radius:50%; background:var(--dim); transition:transform .18s, background .18s; }
  .toggle.on { background:var(--accent); } .toggle.on::after { transform:translateX(19px); background:#fff; }
  .setrow .mvol-input, .setrow input[type=range] { flex:1; accent-color:var(--accent); max-width:200px; }
  .customthemes { display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
  .themeedit { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; max-width:600px; margin-top:6px; }
  .ce { display:flex; align-items:center; gap:10px; background:var(--card); padding:9px 11px; border-radius:var(--r-sm); }
  .ce label { font-size:12px; color:var(--dim); flex:1; }

  .cebar { display:flex; gap:10px; margin-top:14px; align-items:center; }
  #cename { height:40px; border-radius:var(--r-sm); border:1px solid var(--line); background:var(--card); color:var(--text); padding:0 14px; }

  /* ---------- home widget dashboard (modular grid) ---------- */
  .wgrid { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); grid-auto-rows:130px; gap:18px; }
  @media (max-width:1180px){ .wgrid { grid-template-columns:repeat(2, minmax(0,1fr)); } }
  @media (max-width:760px){ .wgrid { grid-template-columns:1fr; } }
  /* a widget wider than the grid on this screen spans what there is, instead of adding phantom columns

  @media (max-width:1180px){ .wgrid > .widget { grid-column:span min(var(--cols,1), 2); } }
  @media (max-width:760px){ .wgrid > .widget { grid-column:1 / -1; } }
  .widget { grid-column:span var(--cols,1); grid-row:span var(--rows,2); display:flex; flex-direction:column;
            background:var(--panel); border:1px solid var(--line); border-radius:var(--r-md); padding:15px 16px 12px;
            animation:pop .3s ease; position:relative; overflow:hidden; }
  /* the body fades at an edge only while there is more to scroll that way (--ft/--fb are set by fadeEdges) */
  .widget .wbody { flex:1; overflow:auto; min-height:0;
    -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 var(--ft,0px), #000 calc(100% - var(--fb,0px)), transparent 100%);
    mask-image:linear-gradient(to bottom, transparent 0, #000 var(--ft,0px), #000 calc(100% - var(--fb,0px)), transparent 100%); }
  .widget .wbody::-webkit-scrollbar { width:7px; height:7px; } .widget .wbody::-webkit-scrollbar-thumb { background:#2c2d38; border-radius:8px; }
  .whead { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }

  .whandle { display:none; cursor:grab; color:var(--dim2); touch-action:none; }
  .whandle svg { width:16px; height:16px; fill:currentColor; }
  .whead .wx { width:30px; height:30px; border:0; background:transparent; color:var(--dim); border-radius:var(--r-xs); display:none; align-items:center; justify-content:center; }

  #app.editwidgets .widget { outline:2px dashed color-mix(in srgb, var(--accent) 40%, var(--line)); }
  #app.editwidgets .wbody { pointer-events:none; opacity:.85; }

  /* ---------- in-page dialog (the native prompt/confirm don't exist inside the Android WebView) ---------- */

  /* ---------------- UI pass ---------------- */

  /* nav labels toggle */

  /* subtle "edit layout" affordance at the end of Home */
  .backbtn { width:40px; height:40px; flex:none; margin-right:-6px; border:0; border-radius:50%; background:transparent; color:var(--text);
             display:flex; align-items:center; justify-content:center; cursor:pointer; }

  .editrow { display:flex; justify-content:center; margin:22px 0 4px; }

  @media (max-width:819px), (max-width:1100px) and (max-height:599px), (max-width:1100px) and (orientation:portrait) {
    /* breathing room against the camera cutout and the chin */
    #main { padding-top:var(--sa-top, env(safe-area-inset-top)); padding-bottom:calc(210px + var(--sa-bottom, env(safe-area-inset-bottom))); }
    #nav { padding:8px 10px calc(12px + var(--sa-bottom, env(safe-area-inset-bottom))); }
    /* mini-player prev/next + elapsed (sizing lives in the primary #miniplayer rule above) */
    #mini-art { width:46px; height:46px; }
    #miniplayer .mbtn { width:36px; height:36px; flex:none; border:0; background:transparent; color:var(--text);
                        display:flex; align-items:center; justify-content:center; border-radius:var(--r-sm); }
    #miniplayer .mbtn:active { background:var(--card); }
    #miniplayer .mbtn svg { width:20px; height:20px; fill:currentColor; }

    @media (max-width:430px) { #mini-time { display:none; } }   /* the title needs the room more */
    #miniplayer { touch-action:none; }   /* gestures own the chip, not the page scroller */
    #miniplayer.idle { opacity:0; pointer-events:none; transform:translateY(12px); }
    #miniplayer { transition:opacity .28s ease, transform var(--t-medium) var(--ease); }

    #nav { left:12px; right:12px; bottom:calc(10px + var(--sa-bottom, env(safe-area-inset-bottom)));
           border:1px solid var(--line); border-radius:var(--r-lg); padding:7px 8px;
           background:color-mix(in srgb, var(--panel) 88%, transparent);
           box-shadow:0 12px 30px rgba(0,0,0,.45),
                      0 0 24px color-mix(in srgb, var(--accent) 12%, transparent);
           backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
    .navbtn { height:52px; border-radius:var(--r-md); }
    #miniplayer { bottom:calc(92px + var(--sa-bottom, env(safe-area-inset-bottom))); }
    #main { padding-bottom:calc(220px + var(--sa-bottom, env(safe-area-inset-bottom))); }
    #hud { bottom:calc(170px + var(--sa-bottom, env(safe-area-inset-bottom))); }
  }

  /* ---------------- motion / polish ---------------- */
  /* one gentle spring + one press-scale, used everywhere for a consistent feel */
  :root { --spring:cubic-bezier(.34,1.3,.64,1); --ease:cubic-bezier(.2,0,0,1); --press:.96; --press-icon:.9; }
  @keyframes popin { from { opacity:0; transform:scale(.82); } to { opacity:1; transform:scale(1); } }
  @keyframes risein { from { opacity:0; transform:translateY(10px) scale(.98); } to { opacity:1; transform:none; } }

  /* sliding selection indicator behind the nav buttons (positioning context set on the
     base #nav rule so it doesn't override the mobile position:fixed) */
  #navpill { position:absolute; left:0; top:0; border-radius:var(--r-sm); opacity:0; pointer-events:none; z-index:0;
             background:linear-gradient(140deg, color-mix(in srgb, var(--accent) 30%, transparent),
                                        color-mix(in srgb, var(--accent) 8%, transparent));
             border:1px solid color-mix(in srgb, var(--accent) 36%, transparent);
             box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 4px 16px color-mix(in srgb, var(--accent) 24%, transparent);
             transition:transform var(--t-long) var(--spring), width var(--t-long) var(--spring), height var(--t-long) var(--spring), opacity .2s ease; }
  .navbtn { position:relative; z-index:1; transition:color .22s ease, transform var(--t-short) var(--spring); }
  .navbtn.sel { background:transparent; border-color:transparent; box-shadow:none; }  /* the pill draws it */

  /* consistent springy press across every interactive element */
  .tile, .pill, .waddchip, .act, .npfav, .mbtn, .backbtn, .themecard, .qitem, .li, .more,
  .transport button, .navbtn, #mute, #eqreset, .railtab, .setrow .toggle {
    transition:transform var(--t-short) var(--spring), background .16s ease, filter .16s ease, color .2s ease; }
  .tile:active, .pill:active, .waddchip:active, .act:active, .npfav:active, .mbtn:active, .backbtn:active,
  .themecard:active, .qitem:active, .li:active, .more:active, .navbtn:active,
  #mute:active, #eqreset:active, .railtab:active { transform:scale(var(--press)); }
  .widget { animation:risein var(--t-medium) var(--ease) both; }
  #main.viewin > * { animation:risein var(--t-medium) var(--ease) both; }

  /* edit mode: affordances spring in, palette staggers */
  #app.editwidgets .whandle, #app.editwidgets .whead .wx, #app.editwidgets .wresize { animation:popin var(--t-medium) var(--spring) both; }
  #app.editwidgets .widget { animation:popin var(--t-medium) var(--spring) both; }
  .waddchip { animation:popin var(--t-medium) var(--spring) both; }
  .waddgrid .waddchip:nth-child(2) { animation-delay:.04s }
  .waddgrid .waddchip:nth-child(3) { animation-delay:.08s }
  .waddgrid .waddchip:nth-child(4) { animation-delay:.12s }
  .waddgrid .waddchip:nth-child(5) { animation-delay:.16s }

  /* edit button: plain grey pencil circle, further down the page */
  .editrow { margin:40px 0 10px; }
  .editrow button { width:46px; height:46px; padding:0; border-radius:50%; justify-content:center;
                    opacity:.4; border:1px solid var(--line); }
  .editrow button:active { opacity:.75; transform:scale(var(--press)); }
  .editrow button svg { width:17px; height:17px; }

  /* scrollbars: hidden everywhere (widgets included) so they never reserve space.
     The ID-based rules further up win on specificity, so they're zeroed explicitly. */
  * { scrollbar-width:none; }
  *::-webkit-scrollbar, #main::-webkit-scrollbar, #rail::-webkit-scrollbar,
  #main::-webkit-scrollbar-thumb, #rail::-webkit-scrollbar-thumb { width:0; height:0; background:transparent; }

  /* status-bar strip painted in the theme colour, above scrolling content */
  #statusbg { position:fixed; top:0; left:0; right:0; height:var(--sa-top, env(safe-area-inset-top));
              background:var(--bg); z-index:55; pointer-events:none; }
  /* header sticks below the status bar and bleeds full-width so nothing peeks past its shading */
  .topbar { top:var(--sa-top, env(safe-area-inset-top)); margin-left:-26px; margin-right:-26px;
            padding-left:26px; padding-right:26px; }
  .topbar::after { left:26px; right:26px; }
  @media (max-width:819px), (max-width:1100px) and (max-height:599px), (max-width:1100px) and (orientation:portrait) {
    .topbar { margin-left:-16px; margin-right:-16px; padding-left:16px; padding-right:16px; }
    .topbar::after { left:16px; right:16px; }
  }

  /* edit pencil lives in the header now */
  .editbtn { width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:transparent;
             color:var(--dim); display:flex; align-items:center; justify-content:center; flex:none;
             margin-left:auto; opacity:.7; }

  /* library: even 2-up grid with equal spacing */
  .libgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:16px; }
  .libgrid .tile { width:auto; }

  /* favourites artwork: themed gradient tile instead of the grey note */
  .thumb.favart { background:linear-gradient(140deg, var(--accent2), var(--accent)); border-radius:var(--r-sm);
                  aspect-ratio:1; display:flex; align-items:center; justify-content:center; }

  /* volume / media HUD */
  #hud { position:fixed; left:50%; bottom:calc(160px + var(--sa-bottom, env(safe-area-inset-bottom)));
         transform:translateX(-50%) translateY(10px); background:var(--card2); border:1px solid var(--line);
         border-radius:var(--r-sm); padding:10px 14px; z-index:58; display:flex; align-items:center; gap:10px;
         opacity:0; pointer-events:none; box-shadow:0 8px 24px rgba(0,0,0,.4);

  #topbarhost { display:none; }

  /* ---------------- glass design language ---------------- */
  .widget, .setrow, #sheetcard, .cp, #hud, .waddchip, .themecard, .editbtn, .pill.ghost,
  #miniplayer, #npbar, .transport button, #mute, #eqreset {
    background:color-mix(in srgb, var(--card) 78%, transparent);
    backdrop-filter:blur(16px) saturate(1.25); -webkit-backdrop-filter:blur(16px) saturate(1.25);
    border:1px solid color-mix(in srgb, var(--line) 85%, transparent);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 6px 20px rgba(0,0,0,.28);
  }
  .widget { border-radius:var(--r-lg); }
  .setrow { border-radius:var(--r-lg); }
  .transport button, #mute, #eqreset { border-radius:var(--r-sm); }
  #r-pp, .wcbtns .pp { background:var(--accent); border-color:transparent; }
  .pill.primary { border:1px solid transparent; }
  /* keep the raised chip / bar readable over content */
  #miniplayer { background:color-mix(in srgb, var(--card2) 86%, transparent); border-radius:var(--r-lg); }
  #npbar { background:color-mix(in srgb, var(--panel) 88%, transparent); }
  .tile .art { box-shadow:0 6px 18px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.04); }

  /* widget scrollbars: slim and themed (rather than hidden) */
  .wbody { scrollbar-width:thin; scrollbar-color:color-mix(in srgb, var(--accent) 50%, transparent) transparent; }
  .wbody::-webkit-scrollbar { width:6px; height:6px; }
  .wbody::-webkit-scrollbar-track { background:transparent; }
  .wbody::-webkit-scrollbar-thumb { background:color-mix(in srgb, var(--accent) 45%, transparent);
                                    border-radius:var(--r-xs); }

  /* widgets in the same row always match height */
  .wgrid { align-items:stretch; }
  .widget { height:100%; }

  /* the header fade must not tint the content under it */
  .topbar::after { height:18px; opacity:.85; }

  /* album / playlist header: never clip the action buttons on a narrow screen */
  .detailhead { flex-wrap:wrap; }
  .detailhead .acts { flex-wrap:wrap; gap:8px; }
  @media (max-width:819px), (max-width:1100px) and (max-height:599px), (max-width:1100px) and (orientation:portrait) {
    .detailhead { flex-direction:column; align-items:flex-start; gap:14px; }
    .detailhead .art { width:min(68vw, 240px); height:min(68vw, 240px); align-self:center; }
    .detailhead > div:not(.art) { width:100%; }
    .detailhead .t { font-size:23px; }
    .detailhead .acts { width:100%; }
    .detailhead .acts .pill { flex:1 1 auto; justify-content:center; padding:0 14px; }
    .detailhead .acts .pill.more { flex:0 0 46px; padding:0; }

  @media (max-width:819px), (max-width:1100px) and (max-height:599px), (max-width:1100px) and (orientation:portrait) {
    /* Page header is a fixed overlay (sticky-in-a-padded-scroller proved unreliable), so
       content can never render above it and it always hugs the status bar. */
    #statusbg { display:none; }
    /* the header is moved into a body-level fixed host, so no ancestor transform/mask can
       shift it and content can never scroll above it */
    #topbarhost { display:block; position:fixed; top:0; left:0; right:0; z-index:56; background:var(--bg); }

  @media (max-width:819px), (max-width:1100px) and (max-height:599px), (max-width:1100px) and (orientation:portrait) {

       FIXED, so toggling it can't change scroll height — that feedback loop was what made
       the old collapse flicker back and forth while scrolling. */

    #rail .raildrag { margin:15px auto 15px; }
    #npbar { display:flex; position:fixed; top:0; left:0; right:0; z-index:9; align-items:center; gap:11px;
             padding:calc(var(--sa-top, env(safe-area-inset-top)) + 9px) 14px 11px;
             background:var(--panel); box-shadow:0 6px 18px rgba(0,0,0,.35);

                    display:flex; align-items:center; justify-content:center; border-radius:var(--r-sm); }

  }

  /* ---- queue modes, sections, reorder ---- */
  .qmodes { display:flex; gap:8px; padding:2px 14px 10px; background:var(--panel); flex-wrap:wrap; }
  .qm { display:inline-flex; align-items:center; gap:7px; height:34px; padding:0 13px 0 10px; border-radius:var(--r-xs); border:1px solid var(--line);
        background:var(--card); color:var(--dim); font:inherit; font-size:12.5px; font-weight:600; cursor:pointer;
        transition:background var(--t-short) var(--ease), color var(--t-short), border-color var(--t-short), transform var(--t-short) var(--ease), border-radius var(--t-short) var(--ease); }

  .qgrip svg { width:18px; height:18px; fill:currentColor; }
  .qgrip:active { cursor:grabbing; color:var(--text); }
  /* ---- mixer extras: output + EQ switch ---- */

  .outrow .l, .eqtoggle .l { font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--dim); }
  .outbtn { flex:1; min-width:0; display:flex; align-items:center; justify-content:space-between; gap:8px; height:40px; padding:0 12px; border-radius:var(--r-sm);
            border:1px solid var(--line); background:var(--card); color:var(--text); font:inherit; font-size:13px; font-weight:560; cursor:pointer; }
  .outbtn span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .outbtn svg { width:16px; height:16px; fill:currentColor; flex:none; color:var(--dim); }

  .eqpresets button { height:28px; padding:0 11px; border-radius:var(--r-full); border:1px solid var(--line); background:var(--card); color:var(--dim); font:inherit; font-size:12px; cursor:pointer; }
  .eqpresets button:active { transform:scale(var(--press)); }
  .eqstatus { font-size:12px; color:var(--dim); min-height:0; margin:2px 0; }
  .eqstatus:empty { display:none; }
  /* ---- output picker ---- */
  #outsheet { position:fixed; inset:0; z-index:60; display:flex; align-items:flex-end; justify-content:center; pointer-events:none; }
  #outsheet .osback { position:absolute; inset:0; background:rgba(0,0,0,.5); opacity:0; transition:opacity .28s; }
  #outsheet .oscard { position:relative; width:min(560px,100%); max-height:82vh; overflow:auto; background:var(--panel); border-radius:var(--r-xl) var(--r-xl) 0 0; padding:16px 16px calc(18px + env(safe-area-inset-bottom));
                      transform:translateY(105%); transition:transform var(--t-medium) var(--ease); box-shadow:0 -12px 40px rgba(0,0,0,.4); }
  #outsheet.show { pointer-events:auto; }
  #outsheet.show .osback { opacity:1; }
  #outsheet.show .oscard { transform:none; }
  @media (min-width:700px) { #outsheet { align-items:center; } #outsheet .oscard { border-radius:var(--r-xl); transform:translateY(24px) scale(.96); opacity:0; transition:transform var(--t-medium) var(--ease), opacity .25s; }
                             #outsheet.show .oscard { transform:none; opacity:1; } }
  .oshead { display:flex; align-items:center; justify-content:space-between; font-weight:700; font-size:16px; margin-bottom:10px; }
  .osx { width:34px; height:34px; border:0; border-radius:50%; background:var(--card); color:var(--text); cursor:pointer; font-size:14px; }
  .osrow { padding:12px; border-radius:var(--r-sm); background:var(--card); margin-bottom:8px; border:1px solid transparent; }
  .osrow.cur { border-color:color-mix(in srgb, var(--accent) 50%, transparent); }
  .osrow .top { display:flex; align-items:center; gap:10px; }
  .osrow .nm { flex:1; min-width:0; font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .osrow .kind { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.05em; }
  .osrow .use { height:30px; padding:0 14px; border-radius:var(--r-full); border:0; background:var(--accent); color:#fff; font:inherit; font-size:12.5px; font-weight:650; cursor:pointer; }
  .osrow .use[disabled] { background:var(--card2); color:var(--dim); cursor:default; }
  .osrow .lv { display:flex; align-items:center; gap:10px; margin-top:10px; }
  .osrow .lv input { flex:1; min-width:0; }
  .osrow .lv .p { width:38px; text-align:right; font-size:12px; color:var(--dim); font-variant-numeric:tabular-nums; }
  .osrow .mu { width:32px; height:32px; border:0; border-radius:var(--r-xs); background:transparent; color:var(--dim); cursor:pointer; font-size:15px; }
  .oshint { font-size:12px; color:var(--dim); margin-top:6px; }
  .osrow input[type=range], .qmodes, .eqtoggle { accent-color:var(--accent); }

  /* two-pane layouts: size the cover from the screen height so the queue always has room */
  @media (min-width:1101px), (min-width:820px) and (min-height:600px) and (orientation:landscape) {
    .artwrap { width:min(100%, clamp(150px, calc(100vh - 560px), 360px)); }
    .np { padding-top:16px; }
  }

  /* ---------- Settings as a list of categories (as in the Android app) ---------- */
  .offcat { display:none !important; }
  .setsec h3.samecat { display:none; }
  .setgroup { max-width:600px; margin-bottom:22px; }
  .setgroup h3 { font-size:12.5px; font-weight:700; color:var(--accent); letter-spacing:.04em; margin:0 0 8px 6px; }
  .setcard { background:var(--card); border-radius:var(--r-lg); overflow:hidden; }
  .setcat { display:flex; align-items:center; gap:16px; width:100%; padding:14px 16px; border:0; background:none; text-align:left;
            color:var(--text); transition:background .15s; }
  .setcat + .setcat { border-top:1px solid color-mix(in srgb, var(--line) 60%, transparent); }
  .setcat:hover { background:color-mix(in srgb, var(--text) 5%, transparent); }
  .setcat:active { background:color-mix(in srgb, var(--text) 8%, transparent); }
  .setcat .ic { width:40px; height:40px; flex:none; border-radius:50%; display:flex; align-items:center; justify-content:center;
                background:color-mix(in srgb, var(--accent) 20%, transparent); color:var(--accent); }
  .setcat .ic svg { width:21px; height:21px; fill:currentColor; }
  .setcat .tx { flex:1; min-width:0; display:flex; flex-direction:column; }
  .setcat .k { font-weight:620; font-size:15px; }
  .setcat .d { font-size:12.5px; color:var(--dim); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .setcat .chev { width:18px; height:18px; fill:var(--dim2); flex:none; }

  /* ---------- the Android app's layout (Playing / Search / Settings) ---------- */
  .navbtn[hidden] { display:none !important; }
  #qpane { display:none; }
  /* Search's tabs: what used to be Home, Library and Favorites */
  .stabs { display:flex; gap:4px; margin:-6px 0 16px; border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none; }
  .stabs::-webkit-scrollbar { display:none; }
  .stab { flex:none; border:0; background:none; color:var(--dim); font-weight:620; font-size:14px; padding:10px 14px 11px;
          position:relative; border-radius:var(--r-sm) var(--r-sm) 0 0; transition:color .15s; }
  .stab:hover { color:var(--text); }
  .stab.on { color:var(--accent); }
  .stab.on::after { content:''; position:absolute; left:12px; right:12px; bottom:-1px; height:3px; border-radius:3px 3px 0 0; background:var(--accent); }

  /* wide: the player on the left, tabs beside it */
  @media (min-width:1101px), (min-width:820px) and (min-height:600px) and (orientation:landscape) {
    #app { grid-template-columns:minmax(340px, .85fr) minmax(0, 1.15fr); grid-template-rows:auto minmax(0, 1fr);
           grid-template-areas:"rail nav" "rail main"; }
    #rail { border-left:0; border-right:1px solid var(--line); }
    #rail .railhead { display:none; }
    #nav { flex-direction:row; align-items:center; gap:2px; padding:10px 18px 0; border-right:0; border-bottom:1px solid var(--line);
           background:transparent; }
    #nav .brand { width:34px; height:34px; margin:0 12px 8px 0; }
    #nav .dot { margin:0 0 8px 10px; }
    .navbtn { width:auto; height:46px; flex-direction:row; gap:8px; padding:0 16px 2px; font-size:14px; font-weight:640;
              border-radius:var(--r-sm) var(--r-sm) 0 0; }
    .navbtn svg { width:20px; height:20px; }
    .navbtn.sel { color:var(--accent); background:none; border:0; box-shadow:none; backdrop-filter:none; }
    .navbtn.sel svg { filter:none; }
    .navbtn:hover { color:var(--text); }
    .navbtn[data-view="playing"] { display:none; }
    #navpill { height:3px !important; border-radius:3px 3px 0 0 !important; background:var(--accent) !important; border:0 !important;
               box-shadow:none !important; }
    #qpane { grid-area:main; flex-direction:column; min-height:0; overflow:hidden; padding:12px 14px 0; }
    #app.v-queue #main, #app.v-lyrics #main { display:none; }
    #app.v-queue #qpane, #app.v-lyrics #qpane { display:flex; }
    #qpane .railbody { flex:1; min-height:0; overflow-y:auto; }
    #qpane #lyricsbody { flex:1; }
    #nav { min-width:0; overflow:hidden; }
  }
  /* a narrower wide screen (a small laptop, or a large display scaling): the tabs drop the logo and draw closer */
  @media (min-width:820px) and (max-width:1060px) and (min-height:600px) and (orientation:landscape), (min-width:1101px) and (max-width:1060px) {
    #nav .brand { display:none; }
    #nav { padding:10px 10px 0; }
    .navbtn { padding:0 11px 2px; gap:6px; }
  }

  /* phones: Playing, Search and Settings along the bottom (a bar, or a floating pill), the player as a page of its own */
  @media (max-width:380px) { h2.viewtitle { font-size:22px; } }
  @media (max-width:819px), (max-width:1100px) and (max-height:599px), (max-width:1100px) and (orientation:portrait) {
    .navbtn[data-view="queue"], .navbtn[data-view="lyrics"] { display:none !important; }
    /* the bar (Material's navigation bar): every page named, the chosen one's icon on a small pill */
    html:not([data-nav="pill"]) #nav { height:auto; padding:8px 0 calc(10px + var(--sa-bottom, env(safe-area-inset-bottom)));
      background:color-mix(in srgb, var(--card) 96%, var(--bg)); border-top:0; }
    html:not([data-nav="pill"]) .navbtn { height:60px; gap:4px; font-size:12px; font-weight:620; background:none; border:0; box-shadow:none; }
    html:not([data-nav="pill"]) .navbtn svg { width:60px; height:32px; padding:4px 18px; border-radius:16px; box-sizing:border-box;
      transition:background-color .2s; }
    html:not([data-nav="pill"]) .navbtn.sel { color:var(--text); background:none; border:0; box-shadow:none; backdrop-filter:none; }
    html:not([data-nav="pill"]) .navbtn.sel svg { background:color-mix(in srgb, var(--accent) 26%, transparent); filter:none; }
    html:not([data-nav="pill"]) #navpill { display:none; }
    /* the floating pill: only the chosen page shows its name */
    html[data-nav="pill"] #nav { left:50%; right:auto; transform:translateX(-50%); bottom:calc(12px + var(--sa-bottom, env(safe-area-inset-bottom)));
           width:auto; max-width:calc(100% - 32px); justify-content:center; gap:2px; padding:6px; border:0; border-radius:999px;
           background:color-mix(in srgb, var(--card2) 96%, transparent); backdrop-filter:blur(14px);
           box-shadow:0 10px 30px rgba(0,0,0,.45), 0 0 0 1px color-mix(in srgb, var(--text) 6%, transparent); }
    html[data-nav="pill"] .navbtn { flex:none; width:auto; height:48px; flex-direction:row; gap:8px; padding:0 15px; border-radius:999px;
           font-size:13.5px; min-width:0; overflow:visible; }
    html[data-nav="pill"] .navbtn span { display:none; }
    html[data-nav="pill"] .navbtn.sel span { display:inline; }
    html[data-nav="pill"] .navbtn.sel { color:var(--text); background:none; border:0; box-shadow:none; backdrop-filter:none; flex:none; }
    html[data-nav="pill"] #navpill { border-radius:999px !important; background:color-mix(in srgb, var(--accent) 26%, var(--card2)) !important;
           border:0 !important; box-shadow:none !important; }
    #app.v-playing #rail { z-index:40; padding-bottom:calc(92px + var(--sa-bottom, env(safe-area-inset-bottom))); }
    /* messages pop up above the navigation and the mini player, not on top of them */
    #toast { bottom:calc(166px + var(--sa-bottom, env(safe-area-inset-bottom))); width:max-content; max-width:calc(100vw - 32px);
             text-align:center; }
    /* the page title and the search box share a line: the box gives way on a narrow phone */
    #searchform, #searchbox { min-width:0; }
    #searchbox { width:100%; }
    body.v-playing #toast { bottom:calc(96px + var(--sa-bottom, env(safe-area-inset-bottom))); }
    #app.v-playing #rail .np { padding-top:calc(18px + env(safe-area-inset-top)); }
    /* a short screen (a phone on its side, a small window): the cover shrinks so the controls stay in view */
    #app.v-playing #rail .artwrap { width:min(100%, max(180px, calc(100dvh - 330px))); }
    body.v-playing #miniplayer { display:none !important; }
    #app.v-playing .raildrag { display:none; }
    body.v-playing #topbarhost { display:none; }
  }
</style>
</head>
<body>

<div id="app">
  <nav id="nav">
    <div class="brand"><img src="/icon.svg" alt=""><span class="word">Starcast</span></div>
    <div class="navtabs">
    <div id="navpill"></div>
    <button class="navbtn sel" data-view="playing"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm-2 14.5v-9l6 4.5z"/></svg><span>Playing</span></button>
    <button class="navbtn" data-view="queue"><svg viewBox="0 0 24 24"><path d="M15 6H3v2h12zm0 4H3v2h12zM3 16h8v-2H3zM17 6v8.18A3 3 0 1019 17V8h3V6z"/></svg><span>Queue</span></button>
    <button class="navbtn" data-view="lyrics" id="nav-lyrics"><svg viewBox="0 0 24 24"><path d="M4 5h16v2H4zm0 4h10v2H4zm0 4h16v2H4zm0 4h10v2H4z"/></svg><span>Lyrics</span></button>
    <button class="navbtn" data-view="search"><svg viewBox="0 0 24 24"><path d="M10 4a6 6 0 104.47 10.03l4.75 4.75 1.41-1.41-4.75-4.75A6 6 0 0010 4zm0 2a4 4 0 110 8 4 4 0 010-8z"/></svg><span>Search</span></button>
    </div>
    <div class="spacer"></div>
    <button class="navbtn" data-view="settings"><svg viewBox="0 0 24 24"><path d="M19.14 12.94a7.6 7.6 0 000-1.88l2.03-1.58a.5.5 0 00.12-.64l-1.92-3.32a.5.5 0 00-.6-.22l-2.39.96a7 7 0 00-1.62-.94l-.36-2.54a.5.5 0 00-.5-.42h-3.84a.5.5 0 00-.5.42l-.36 2.54c-.58.24-1.12.56-1.62.94l-2.39-.96a.5.5 0 00-.6.22L2.7 8.84a.5.5 0 00.12.64l2.03 1.58a7.6 7.6 0 000 1.88L2.82 14.5a.5.5 0 00-.12.64l1.92 3.32c.14.24.42.32.6.22l2.39-.96c.5.38 1.04.7 1.62.94l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.58-.24 1.12-.56 1.62-.94l2.39.96c.18.08.46 0 .6-.22l1.92-3.32a.5.5 0 00-.12-.64l-2.03-1.58zM12 15.5a3.5 3.5 0 110-7 3.5 3.5 0 010 7z"/></svg><span>Settings</span></button>
    <div id="ndot" class="dot"></div>
  </nav>

  <main id="main"></main>
  <section id="qpane" aria-label="Queue and lyrics"></section>

  <aside id="rail">
    <button class="railclose" id="railclose" title="Close"><svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg></button>
    <div id="npbar">
      <img id="npbar-art"><div class="t" id="npbar-t"></div>
      <button id="npbar-pp" aria-label="Play"><svg id="npbar-pp-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
    </div>
    <div class="np">
      <div class="raildrag"></div>
      <div class="artstage">
        <div id="np-glow"></div>
        <div class="artwrap">
          <div id="np-art" class="art idle">Nothing playing</div>
          <div class="seekpop l" id="seekpop-l"></div>
          <div class="seekpop r" id="seekpop-r"></div>
        </div>
      </div>
      <div class="nptrow">
        <div id="np-t" class="t">Nothing playing</div>
        <button id="np-like" class="npfav" title="Like on YouTube Music" style="display:none"><svg viewBox="0 0 24 24"><path d="M2 21h4V9H2v12zM23 10a2 2 0 00-2-2h-6.31l.95-4.57.03-.32a1.5 1.5 0 00-.44-1.06L14.17 1 7.59 7.59A2 2 0 007 9v10a2 2 0 002 2h9a2 2 0 001.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg></button>
        <button id="np-fav" class="npfav" title="Favorite" style="display:none"><svg viewBox="0 0 24 24"><path d="M12 4.4l2.1 4.6 5 .4-3.8 3.3 1.2 4.9L12 15.4 7.5 17.6l1.2-4.9L4.9 9.4l5-.4z" fill="none" stroke="currentColor" stroke-width="1.7"/></svg></button>
        <button id="np-share" class="npfav" title="Share" style="display:none"><svg viewBox="0 0 24 24"><path d="M18 16a3 3 0 00-2.3 1.1l-6.1-3.5a3 3 0 000-1.2l6-3.5A3 3 0 1015 6l-6 3.5a3 3 0 100 5l6.1 3.6A3 3 0 1018 16z"/></svg></button>
      </div>
      <div id="np-s" class="s"></div>
      <div class="seek">
        <input type="range" id="seek" min="0" max="1000" value="0" disabled>
        <div class="times"><span id="tpos">0:00</span><span id="tdur">0:00</span></div>
      </div>
      <div class="transport">
        <button id="r-prev" aria-label="Previous" title="Previous" disabled><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3 6l9-6v12z"/></svg></button>
        <button id="r-pp" aria-label="Play" disabled><svg id="pp-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
        <button id="r-next" aria-label="Next" title="Next" disabled><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l9-6-9-6z"/></svg></button>
      </div>
      <div class="ytvol">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0014 7.97v8.06A4.5 4.5 0 0016.5 12zM14 3.23v2.06a7 7 0 010 13.42v2.06a9 9 0 000-17.54z"/></svg>
        <input type="range" id="mvol" class="mvol-input" min="0" max="100" value="0" disabled>
        <span class="p" id="mvolpct"></span>
      </div>
    </div>
    <div class="railhead"><button class="rtab on" data-rt="queue">Up next</button><button class="rtab" data-rt="lyrics" id="rt-lyrics" style="display:none">Lyrics</button><span class="c" id="qcount"></span></div>
    <div class="qmodes" id="qmodes" style="display:none">
      <button class="qm" id="qm-shuffle" title="Shuffle (double-tap to reshuffle)"><svg viewBox="0 0 24 24"><path d="M10.6 9.2L5.4 4 4 5.4l5.2 5.2 1.4-1.4zM14.5 4l2.0 2-12.5 12.5 1.4 1.4L17.9 7.4l2.1 2.1V4h-5.5zm.4 9.8l-1.4 1.4 3.3 3.3-2.1 2.1H20v-5.5l-2.0 2-3.1-3.3z"/></svg><span>Shuffle</span></button>
      <button class="qm" id="qm-repeat" title="Loop"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg><span id="qm-repeat-l">Loop off</span></button>
      <button class="qm" id="qm-auto" title="Autoplay"><svg viewBox="0 0 24 24"><path d="M5 4l9 8-9 8V4zm11 0h3v16h-3z"/></svg><span>Autoplay</span></button>
      <button class="qm" id="qm-save" title="Save the queue as a playlist"><svg viewBox="0 0 24 24"><path d="M3 6h12v2H3zm0 4h12v2H3zm0 4h8v2H3zm13 0h2v3h3v2h-3v3h-2v-3h-3v-2h3z"/></svg><span>Save</span></button>
    </div>
    <div class="railbody" id="railbody"></div>
    <div id="lyricsbody"></div>
  </aside>
</div>

<div id="miniplayer">
  <img id="mini-art">
  <div class="mm"><div id="mini-t">Nothing playing</div><div id="mini-s"></div></div>
  <span id="mini-time"></span>
  <button id="mini-prev" class="mbtn" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3 6l9-6v12z"/></svg></button>
  <button id="mini-pp" aria-label="Play"><svg id="mini-pp-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
  <button id="mini-next" class="mbtn" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l9-6-9-6z"/></svg></button>
</div>

<div id="askwrap"><div class="ask">
  <h3 id="ask-t"></h3><p id="ask-p"></p>
  <input id="ask-in" autocomplete="off" maxlength="150">
  <div class="btns"><button class="pill ghost" id="ask-no">Cancel</button><button class="pill primary" id="ask-yes">OK</button></div>
</div></div>

<div id="sheet"><div id="sheetcard">
  <div id="sheethead"><img class="art" id="sheet-art"><div style="min-width:0">
    <div class="t" id="sheet-t"></div><div class="s" id="sheet-s"></div></div></div>
  <div id="sheet-acts"></div>
</div></div>

<div class="cpwrap" id="cpwrap"><div class="cp">
  <div class="cptitle" id="cp-title">Color</div>
  <div class="sv" id="cp-sv"><div class="wl"></div><div class="bl"></div><div class="knob" id="cp-svknob"></div></div>
  <div class="hue" id="cp-hue"><div class="knob" id="cp-hueknob"></div></div>

  <div class="cpin" id="cp-inputs"></div>
  <div class="cpbtns"><button class="pill ghost" id="cp-cancel">Cancel</button><button class="pill primary" id="cp-ok">Done</button></div>
</div></div>

<div id="topbarhost"></div>
<div id="statusbg"></div>

<div id="hud">
  <svg id="hud-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0014 7.97v8.06A4.5 4.5 0 0016.5 12z"/></svg>
  <span class="lbl" id="hud-lbl" style="display:none"></span>
  <div class="bar" id="hud-bar"><i></i></div>
  <span class="pct" id="hud-pct"></span>
</div>

<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const el = (t, c) => { const e = document.createElement(t); if (c) e.className = c; return e; };
const PLAY = 'M8 5v14l11-7z', PAUSE = 'M6 5h4v14H6zm8 0h4v14h-4z';
const ART_FALLBACK = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" fill="#20212a"/><path d="M32 26v20a7 7 0 11-3-5.7V22l18-4v18a7 7 0 11-3-5.7V17z" fill="#4a4c5c"/></svg>');
const fmt = s => { if (!isFinite(s) || s < 0) s = 0; const m = Math.floor(s/60), r = Math.floor(s%60); return m + ':' + String(r).padStart(2,'0'); };
// At another speed the song's times are how long it takes to hear (0.8x: a 3:00 song shows 3:45), as in YouTube Music
// and on Discord. Positions themselves stay in the song's time (seeking and the bar use them).
const rateOf = (n) => { const r = n && Number(n.speed); return r >= 0.25 && r <= 4 ? r : 1; };
const fmtAt = (s, n) => fmt(s / rateOf(n));

let toastT;
const WIDE_MQ = window.matchMedia('(min-width:1101px), (min-width:820px) and (min-height:600px) and (orientation:landscape)');
const isWide = () => WIDE_MQ.matches;   // landscape tablets and desktops get the two-pane layout

/* Small in-page dialog. Resolves to the typed text (input mode) or true (confirm mode); null when cancelled. */
function askBox(o) {
  return new Promise(res => {
    const w = $('#askwrap'), inp = $('#ask-in'), yes = $('#ask-yes'), no = $('#ask-no');
    $('#ask-t').textContent = o.title || ''; $('#ask-p').textContent = o.text || '';
    $('#ask-p').style.display = o.text ? '' : 'none';
    inp.style.display = o.input ? '' : 'none'; inp.value = o.value || ''; inp.placeholder = o.placeholder || '';
    yes.textContent = o.ok || 'OK';
    yes.className = 'pill ' + (o.danger ? 'danger' : 'primary');
    const done = v => { w.classList.remove('show'); yes.onclick = no.onclick = w.onclick = inp.onkeydown = null; res(v); };
    yes.onclick = () => { const v = inp.value.trim(); if (o.input && !v) { inp.focus(); return; } done(o.input ? v : true); };
    no.onclick = () => done(null);
    w.onclick = e => { if (e.target === w) done(null); };
    inp.onkeydown = e => { if (e.key === 'Enter') yes.click(); else if (e.key === 'Escape') no.click(); };
    w.classList.add('show');
    if (o.input) setTimeout(() => { inp.focus(); inp.select(); }, 60);
  });
}

};
function ytmError(code) {
  code = String(code || '');
  if (/^no_(shuffle|repeat)_button/.test(code)) return "Couldn't find that button. Reload the YTM Starcast extension, then refresh the YouTube Music tab.";
  return YTM_ERRORS[code] || YTM_ERRORS[code.split(':')[0]] || code.replace(/_/g, ' ');
}
async function ytm(cmd, quiet) {
  let r;
  if (partOn('remote')) r = await post('/api/ytm', cmd);
  // With the YouTube Music remote switched off, play / pause / skip / seek still work through the computer's own
  // player controls (as they do when no YouTube Music tab is open); everything else belongs to the remote.
  else if (cmd && cmd.type === 'transport') r = await post('/api/media', cmd.action === 'seek' ? { action:'seek', position:cmd.position } : { action:cmd.action });
  else r = { error:'part_off' };
  if (r && r.error && !quiet) toast(ytmError(r.error));
  return r; }

/* ==================== parts: which parts of YTM Starcast are switched on (set on the computer, shared by every app) ==================== */
// null until the computer says. An older server has no parts at all: then everything counts as on and the
// Parts group in Settings stays hidden.
let parts = null, partsSupported = null, partsHeldUntil = 0, partsSig = '1/1', discordRefresh = null;
const PARTS = [
  ['remote', 'YouTube Music remote', 'Search, your library and the queue in this app, through the browser extension.'],
  ['discord', 'Discord status', 'Shows the song you are listening to on your Discord profile.'],
  ['refine', 'Refine in YouTube Music', 'Improvements inside YouTube Music in the computer\'s browser.'],
  ['audio', 'Computer audio', 'The computer\'s volume, outputs and equalizer in this app.'],
];
const REMOTE_VIEWS = new Set(['search', 'playlists', 'favorites', 'detail', 'artist']);
function partOn(k) { return !parts || parts[k] !== false; }
function viewAllowed(v) { return !(REMOTE_VIEWS.has(v) && !partOn('remote')) && !(v === 'mixer' && !partOn('audio')); }
// A reply from the computer (the state poll, or GET / POST /api/parts).
function setParts(p, fromPoll) {
  if (!p || typeof p !== 'object') return;
  partsSupported = true;
  if (fromPoll && Date.now() < partsHeldUntil) return;     // a switch you just flipped wins over a poll already on its way
  const same = parts && PARTS.every(([k]) => (parts[k] !== false) === (p[k] !== false));
  parts = Object.assign({}, p);
  if (same) paintParts(); else applyParts();
}
function applyParts() {
  const root = document.documentElement, remote = partOn('remote'), audio = partOn('audio');
  root.dataset.remote = remote ? 'on' : 'off'; root.dataset.audio = audio ? 'on' : 'off';
  paintParts(); syncRail();
  const sig = (remote ? 1 : 0) + '/' + (audio ? 1 : 0);
  if (sig === partsSig) return;
  partsSig = sig;
  if (!viewAllowed(view)) setView('home');       // the page you were on belongs to a part that is now off
  else if (view === 'home') render();             // home widgets come and go with their parts
  setTimeout(moveNavPill, 40);
}
function paintParts() {
  document.querySelectorAll('.partsec').forEach(sec => {
    sec.hidden = partsSupported !== true;
    sec.querySelectorAll('.toggle[data-pk]').forEach(t => { const on = partOn(t.dataset.pk);
      t.classList.toggle('on', on); t.setAttribute('aria-checked', on ? 'true' : 'false'); });
  });
}
async function setPart(k, on) {
  const prev = parts, label = (PARTS.find(p => p[0] === k) || [k, k])[1];
  parts = Object.assign({}, parts || {}, { [k]: on }); partsHeldUntil = Date.now() + 5000; applyParts();
  const r = await post('/api/parts', { [k]: on });
  if (r && r.parts && typeof r.parts === 'object') {
    partsHeldUntil = Date.now() + 2000; parts = Object.assign({}, r.parts); applyParts();
    toast(label + (partOn(k) ? ' on' : ' off'));
  } else {
    parts = prev; partsHeldUntil = 0; applyParts();
    toast((r && (r.message || r.error)) || "Couldn't reach the computer");
  }
  if (k === 'discord' && discordRefresh) discordRefresh(true);
}
// Settings → Parts: one switch per part. Hidden until the computer confirms it has parts.
function partsSection() {
  const sec = el('div', 'setsec partsec'); sec.appendChild(Object.assign(el('h3'), { textContent:'Parts' }));
  for (const [k, l, d] of PARTS) {
    const r = el('div', 'setrow'); r.innerHTML = '<div><div class="k"></div><div class="d"></div></div>';
    r.querySelector('.k').textContent = l; r.querySelector('.d').textContent = d;
    const t = el('button', 'toggle' + (partOn(k) ? ' on' : '')); t.dataset.pk = k; t.setAttribute('role', 'switch'); t.setAttribute('aria-label', l);
    t.addEventListener('click', () => setPart(k, !partOn(k)));
    r.appendChild(t); sec.appendChild(r);
  }
  sec.hidden = partsSupported !== true;
  setTimeout(paintParts, 0);
  if (partsSupported !== false) fetch('/api/parts', { cache:'no-store' }).then(async r => {
    if (r.status === 404) { partsSupported = false; paintParts(); return; }   // an older server: no parts to show
    if (!r.ok) return;
    const j = await r.json(); if (j && j.parts) setParts(j.parts); else { partsSupported = false; paintParts(); }
  }).catch(() => {});
  return sec;
}

  line(act.details, 't'); line(act.state); if (a.large_text && a.large_text !== act.details) line(a.large_text);
  if (!act.details && !act.state) line('YouTube Music', 't');
  const ts = act.timestamps || {};
  if (ts.start && ts.end && ts.end > ts.start) {
    const tot = ts.end - ts.start, done = Math.min(tot, Math.max(0, Date.now() - ts.start));

    lines.appendChild(p);

  for (const bt of act.buttons || []) card.appendChild(Object.assign(el('div', 'dcbtn'), { textContent: bt.label || 'Listen' }));

/* ==================== the browser extension: is it there, and a step-by-step guide to add it ==================== */
// Browsers only take this extension by hand ("Load unpacked"), so Settings walks through it. The computer keeps a copy
// of the extension in a fixed folder and can open that folder, or a browser's extensions page, on its own screen.
let extGuideOpen = false, extKey = null, extScroll = false;
function extBrief() { return (mixerState && mixerState.extension) || null; }
function extStatusText(s) {
  if (!s) return ['Checking…', ''];
  if (s.connected && s.outdated) return ['An older version is running in the browser. Reload it (steps below).', 'warn'];
  if (s.connected) return ['Connected' + (s.version ? ' · version ' + s.version : ''), 'ok'];
  if (s.everConnected) return ["Not connected right now. Open YouTube Music in the computer's browser.", 'warn'];
  return ['Not added to a browser yet.', 'bad'];
}
// Open on another device: the addresses YTM Starcast can be reached at, each with a QR code to scan with a phone.
let lastConnect = null;
function connectSection() {
  const sec = el('div', 'setsec connsec'); sec.appendChild(Object.assign(el('h3'), { textContent:'Open on another device' }));
  const body = el('div'); sec.appendChild(body);
  let sig = '';
  const show = (c) => {
    if (JSON.stringify(c) === sig) return;
    sig = JSON.stringify(c); body.innerHTML = '';
    const phone = (c.addresses || []).filter(a => a.phone && a.url);
    if (!phone.length) {
      const row = el('div', 'setrow');
      row.innerHTML = `<div><div class="k">Only this computer can open it</div><div class="d">To use it from your phone,
        install Tailscale on both (recommended), or start YTM Starcast with --lan for your home network.</div></div>`;
      body.appendChild(row); return;
    }
    let pick = phone[0];
    const card = el('div', 'conncard'), qr = el('div', 'connqr'), side = el('div', 'connside');
    card.append(qr, side); body.appendChild(card);
    // the link carries the access token when one is needed: shown shortened, copied whole
    const shown = (u) => u.replace(/([?&]token=)[^&#]+/, '$1…');
    const paint = () => {
      qr.innerHTML = pick.qr || '';
      side.innerHTML = '';
      const d = el('div', 'd');
      d.textContent = "Scan the code with your phone's camera, or open one of these addresses on it:";
      side.appendChild(d);
      for (const a of phone) {
        const b = el('button', 'connaddr' + (a === pick ? ' sel' : ''));
        b.innerHTML = '<span class="k"></span><span class="u"></span>';
        b.querySelector('.k').textContent = a.label; b.querySelector('.u').textContent = shown(a.url);
        b.addEventListener('click', () => { pick = a; paint(); });
        side.appendChild(b);
      }
      const cp = el('button', 'pill ghost'); cp.textContent = 'Copy the link';
      cp.addEventListener('click', () => copyText(pick.url, 'Link copied'));
      side.appendChild(cp);
    };
    paint();
  };
  if (lastConnect) show(lastConnect);        // what it said last time, at once (the settings page is redrawn now and then)
  (async () => {
    let c = null;
    try { const r = await fetch('/api/connect', { cache:'no-store' }); if (r.ok) c = await r.json(); } catch (e) {}
    if (!c) { if (!lastConnect) sec.remove(); return; }      // a server without it
    lastConnect = c; show(c);
  })();
  return sec;
}

function copyText(text, done) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => toast(done), () => toast("Couldn't copy here"));
    return;
  }
  // plain HTTP (over Tailscale): execCommand still works there
  const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast(done); } catch (e) { toast("Couldn't copy here"); }
  document.body.removeChild(ta);
}

function extensionSection() {
  const sec = el('div', 'setsec extsec'); sec.appendChild(Object.assign(el('h3'), { textContent:'Browser extension' }));
  const head = el('div', 'setrow');
  head.innerHTML = '<div><div class="k">YTM Starcast extension</div><div class="d"></div></div>';
  const btn = el('button', 'pill ghost'); btn.style.height = '38px';
  head.appendChild(btn); sec.appendChild(head);
  const guide = el('div', 'extguide'); sec.appendChild(guide);
  let info = null, timer = null, guideSig = '', liveEl = null;
  const paintHead = () => {
    const s = info || extBrief(); const [txt, tone] = extStatusText(s);
    const d = head.querySelector('.d'); d.textContent = txt; d.dataset.tone = tone;
    btn.textContent = extGuideOpen ? 'Hide the steps' : (s && s.connected && !s.outdated ? 'Show the steps' : 'Set it up');
  };
  const load = async () => {
    try { const r = await fetch('/api/extension', { cache:'no-store' }); if (r.ok) info = await r.json(); else if (r.status === 404) info = null; }
    catch (e) {}
    paintHead();
    // rebuild the steps only when they change (rebuilding on every check would swallow taps on their buttons)
    const sig = extGuideOpen + '|' + !!info + '|' + !!(info && info.connected && info.outdated) + '|' +
      (info ? (info.browsers || []).map(b => b.id).join(',') + '|' + info.folder : '');
    if (sig !== guideSig) paintGuide(); else paintLive();
  };
  const paintLive = () => {
    if (!liveEl || !info) return;
    const ok = info.connected && !info.outdated;
    liveEl.textContent = ok ? '✓ The extension is connected.' : 'Waiting for the extension…';
    liveEl.dataset.tone = ok ? 'ok' : '';
  };
  const openOnComputer = async (body, b) => {
    b.disabled = true;
    const r = await post('/api/extension/open', body);
    b.disabled = false;
    toast(r && r.ok ? 'Opened on the computer' : ((r && (r.message || r.error)) || "Couldn't reach the computer"));
  };
  const step = (n, title, body) => {
    const li = el('li', 'extstep'); li.innerHTML = '<div class="n"></div><div class="b"><div class="k"></div></div>';
    li.querySelector('.n').textContent = n; li.querySelector('.k').textContent = title;
    if (body) li.querySelector('.b').appendChild(body); return li;
  };
  const paintGuide = () => {
    guideSig = extGuideOpen + '|' + !!info + '|' + !!(info && info.connected && info.outdated) + '|' +
      (info ? (info.browsers || []).map(b => b.id).join(',') + '|' + info.folder : '');
    guide.textContent = ''; guide.hidden = !extGuideOpen; liveEl = null;
    if (!extGuideOpen) return;
    if (!info) { guide.appendChild(Object.assign(el('div', 'd'), { textContent: "This computer's YTM Starcast is too old to help with this. Update it first." })); return; }
    const ol = el('ol', 'extsteps');
    if (info.connected && info.outdated) {
      const d1 = el('div', 'd'); d1.textContent = 'Open the extensions page in the browser that plays YouTube Music, find YTM Starcast (an older copy may still be called "Pocketfader") and press its reload button. If a greyed-out YTM Starcast stays beside it afterwards, remove that one.';
      ol.appendChild(step(1, 'Reload the extension', d1));
      ol.appendChild(step(2, 'Refresh the YouTube Music tab', null));
    } else {
      // 1. the extensions page
      const b1 = el('div');
      const g = el('div', 'chips');
      for (const br of info.browsers || []) {
        const b = el('button', 'pill ghost'); b.textContent = 'Open in ' + br.name;
        b.addEventListener('click', () => openOnComputer({ what:'page', browser:br.id }, b)); g.appendChild(b);
      }
      const d1 = el('div', 'd');
      d1.textContent = (info.browsers || []).length
        ? 'Opens it on the computer. Or type its address into the address bar: ' + info.browsers.map(b => b.page).join(', ') + '.'
        : "Type chrome://extensions (Brave: brave://extensions, Edge: edge://extensions) into the computer's browser.";
      if ((info.browsers || []).length) b1.appendChild(g);
      b1.appendChild(d1);
      ol.appendChild(step(1, "Open the browser's extensions page", b1));
      // 2. developer mode

      ol.appendChild(step(2, 'Turn on Developer mode', d2));
      // 3. load unpacked
      const b3 = el('div');
      const path = el('code', 'extpath'); path.textContent = info.folder; b3.appendChild(path);
      const g3 = el('div', 'chips');
      const copy = el('button', 'pill ghost'); copy.textContent = 'Copy the folder';
      copy.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(info.folder); toast('Copied'); } catch (e) { toast("Couldn't copy here: select the folder above instead"); }
      });
      const show = el('button', 'pill ghost'); show.textContent = 'Show it on the computer';
      show.addEventListener('click', () => openOnComputer({ what:'folder' }, show));
      g3.appendChild(copy); g3.appendChild(show); b3.appendChild(g3);
      const d3 = el('div', 'd'); d3.textContent = 'You can also drag that folder onto the extensions page.'; b3.appendChild(d3);
      ol.appendChild(step(3, 'Click "Load unpacked" and choose this folder', b3));
      // 4. youtube music
      const d4 = el('div', 'd'); d4.textContent = 'Open music.youtube.com in that browser, or refresh its tab if it is already open.';
      ol.appendChild(step(4, 'Open YouTube Music', d4));
    }
    guide.appendChild(ol);

  };
  btn.addEventListener('click', () => { extGuideOpen = !extGuideOpen; paintHead(); paintGuide(); if (extGuideOpen) load(); });
  // while the guide is open, see it connect by itself
  timer = setInterval(() => { if (!sec.isConnected) { clearInterval(timer); return; } if (extGuideOpen) load(); else paintHead(); }, 2500);
  const s0 = extBrief();
  if (s0 && !s0.everConnected) extGuideOpen = true;      // never set up: show the steps straight away
  paintHead(); load();
  if (extScroll) { extScroll = false; setTimeout(() => sec.scrollIntoView({ behavior:'smooth', block:'start' }), 150); }
  return sec;
}

// The most vivid colour of a small copy of the cover: hues in 10-degree bins, weighted by how colourful each pixel is.

// Pointer-based drag reorder (works on PC + touch, unlike native HTML5 drag).
function enableWidgetDrag(card, grid, m) {
  const handle = card.querySelector('.whandle');
  handle.addEventListener('pointerdown', e => {
    if (!$('#app').classList.contains('editwidgets')) return;
    e.preventDefault(); handle.setPointerCapture?.(e.pointerId); card.classList.add('dragging');
    const onMove = ev => {
      const sibs = [...grid.querySelectorAll('.widget:not(.dragging)')];
      let best = null, bd = Infinity;
      for (const s of sibs) { const r = s.getBoundingClientRect(); const d = Math.hypot(ev.clientX - (r.left + r.width/2), ev.clientY - (r.top + r.height/2));
        if (d < bd) { bd = d; best = s; } }
      if (best) { const r = best.getBoundingClientRect();
        const after = ev.clientY > r.top + r.height/2 || (Math.abs(ev.clientY - (r.top + r.height/2)) < 10 && ev.clientX > r.left + r.width/2);
        grid.insertBefore(card, after ? best.nextSibling : best); }
    };
    const onUp = () => {
      document.removeEventListener('pointermove', onMove); document.removeEventListener('pointerup', onUp);
      card.classList.remove('dragging');
      const all = getLayout(), byId = Object.fromEntries(all.map(z => [z.id, z]));
      const shown = [...grid.querySelectorAll('.widget')].map(c => byId[c.dataset.wid]).filter(Boolean);
      // widgets of a part that is switched off aren't on the page: keep them (after the rest) for when it is back on
      setLayout(shown.concat(all.filter(z => !shown.includes(z))));
    };
    document.addEventListener('pointermove', onMove); document.addEventListener('pointerup', onUp);
  });
}
// Drag the corner to resize: horizontal = column span (1–3), vertical past a point = tall.
function enableWidgetResize(card, rz, grid) {
  rz.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation(); rz.setPointerCapture?.(e.pointerId);
    const cols3 = window.matchMedia('(max-width:760px)').matches ? 1 : window.matchMedia('(max-width:1180px)').matches ? 2 : 3;
    const colW = grid.getBoundingClientRect().width / cols3;
    const rowH = 130 + 18;   // grid-auto-rows height + row gap
    const startRect = card.getBoundingClientRect();
    const onMove = ev => {
      const cols = Math.max(1, Math.min(cols3, Math.round((ev.clientX - startRect.left) / colW)));
      const rows = Math.max(1, Math.min(8, Math.round((ev.clientY - startRect.top) / rowH)));
      card.style.setProperty('--cols', cols); card.style.setProperty('--rows', rows);
    };
    const onUp = () => {
      document.removeEventListener('pointermove', onMove); document.removeEventListener('pointerup', onUp);
      const cols = parseInt(card.style.getPropertyValue('--cols')) || 1;
      const rows = parseInt(card.style.getPropertyValue('--rows')) || 2;
      setLayout(getLayout().map(z => z.id === card.dataset.wid ? { ...z, cols, rows } : z));
    };
    document.addEventListener('pointermove', onMove); document.addEventListener('pointerup', onUp);
  });
}
